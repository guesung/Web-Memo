  note: "예외로 production에만 둔다. Sentry Internal Integration의 Client Secret은 생성 때 한 번만 표시돼 다른 환경에 같은 값을 복사할 수 없다. 통일하려면 시크릿을 회전하고 세 환경에 새 값을 등록한다"

