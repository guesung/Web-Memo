  impact: "크롬 웹스토어 API 인증이 실패해 확장 배포와 스토어 현황 조회가 멈춘다"

- name: CLIENT_SECRET
  kind: secret
  stores: [github]
  consumers: [.github/workflows/cd-extension.yml, .github/workflows/ci.yml, .github/workflows/versions.yml]
  impact: "크롬 웹스토어 API 인증이 실패해 확장 배포와 스토어 현황 조회가 멈춘다"

- name: REFRESH_TOKEN
  kind: secret
  stores: [github]
  consumers: [.github/workflows/cd-extension.yml, .github/workflows/ci.yml, .github/workflows/versions.yml]
  impact: "크롬 웹스토어 API 인증이 실패해 확장 배포와 스토어 현황 조회가 멈춘다"

- name: EXPO_TOKEN
  kind: secret
