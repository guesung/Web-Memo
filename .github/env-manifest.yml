  consumers: [.github/workflows/cd-app.yml]
  impact: "EAS 로그인이 실패해 앱 빌드가 멈춘다"

- name: EXPO_ASC_API_KEY_P8
  kind: secret
  stores: [github]
  consumers: [.github/workflows/cd-app.yml, .github/workflows/ci.yml, .github/workflows/versions.yml]
  impact: "TestFlight 제출과 App Store 현황 조회가 실패한다"

- name: EXPO_ANDROID_SERVICE_ACCOUNT_JSON
  kind: secret
  stores: [github]
  consumers: [.github/workflows/cd-app.yml, .github/workflows/ci.yml, .github/workflows/versions.yml]
