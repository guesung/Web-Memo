- name: NOTION_TOKEN
  kind: secret
  stores: [github]
  consumers: [.github/workflows/refactor-audit.yml]
  impact: "주간 리팩토링 점검 결과가 노션 작업 카드로 만들어지지 않는다"

- name: SLACK_WEBHOOK_URL
  kind: secret
  stores: [github]
  consumers: [.github/workflows/ci.yml, .github/workflows/cd-web.yml, .github/workflows/daily-ga-report.yml, .github/workflows/weekly-ga-report.yml, .github/workflows/refactor-audit.yml, .github/workflows/notify-release.yml, .github/workflows/versions.yml, .github/workflows/env-registry-audit.yml, .github/workflows/seo-monitor.yml, .github/workflows/supabase-audit.yml]
  impact: "빌드, 배포, 릴리스 결과와 리포트·Supabase 감사 실패 알림이 오지 않는다"

- name: SLACK_REPORT_WEBHOOK_URL
  kind: secret
  stores: [github]
  consumers: [.github/workflows/daily-ga-report.yml, .github/workflows/weekly-ga-report.yml, .github/workflows/refactor-audit.yml, .github/workflows/seo-monitor.yml]
  impact: "GA 리포트, 주간 리팩토링 점검 결과, 조치가 필요한 SEO 감사 결과가 전용 채널로 게시되지 않는다"

- name: SLACK_REPORT_CHANNEL_ID
  kind: secret
  stores: [github]
  consumers: [.github/workflows/seo-monitor.yml]
  impact: "SEO AI 리포트를 스레드로 보내지 못하고 기존 기계 판정 알림으로 대신한다. 봇(SLACK_BOT_TOKEN)이 이 채널에 초대돼 있어야 한다"

- name: SLACK_CHANNEL_ID
  kind: secret
  stores: [github]
  consumers: [.github/workflows/ci.yml]
  impact: "머지 스레드가 생기지 않고 웹훅 알림으로 폴백한다"

- name: SUPABASE_ACCESS_TOKEN
  kind: secret
  stores: [github]
  consumers: [.github/workflows/env-registry-audit.yml, .github/workflows/supabase-audit.yml]
  impact: "등록 현황 감사가 Supabase secrets를 조회하지 못하고 운영 감사가 실패한다"
  note: "Supabase 대시보드의 Account > Access Tokens에서 발급한다. 조회 전용으로 쓴다"

- name: APP_ID
  kind: secret
  stores: [github]
  consumers: [.github/workflows/cleanup-unused.yml, .github/workflows/env-registry-audit.yml]
  impact: "GitHub App 토큰을 만들지 못해 미사용 파일 정리 PR이 생기지 않고, 등록 현황 감사가 GitHub Secrets를 조회하지 못한다"

- name: APP_PRIVATE_KEY
  kind: secret
  stores: [github]
  consumers: [.github/workflows/cleanup-unused.yml, .github/workflows/env-registry-audit.yml]
  impact: "GitHub App 토큰을 만들지 못해 미사용 파일 정리 PR이 생기지 않고, 등록 현황 감사가 GitHub Secrets를 조회하지 못한다"
  note: "등록 현황 감사가 쓰려면 GitHub App에 Secrets: read 권한이 있어야 한다"

# ---------------------------------------------------------------------------
# GitHub와 Vercel에 같은 이름이 따로 등록되는 값 (서로 읽지 못하므로 양쪽에 등록하고 값을 맞춘다)
# ---------------------------------------------------------------------------

- name: SENTRY_AUTH_TOKEN
  kind: secret
  stores: [github, vercel]
  consumers: [.github/workflows/cd-extension.yml, apps/web/next.config.mjs, packages/vite-config/lib/withPageConfig.mjs]
  impact: "Sentry 소스맵 업로드가 조용히 실패한다. 빌드는 통과하므로 스택 트레이스가 난독화된 채 보여야 알게 된다"
  note: "확장은 GitHub Secrets, 웹은 Vercel 프로젝트 환경변수로 받는다"

- name: SLACK_BOT_TOKEN
  kind: secret
  stores: [github, vercel]
  consumers: [.github/workflows/ci.yml, apps/web/src/modules/slack/config.ts, .github/workflows/seo-monitor.yml]
  impact: "GitHub는 머지 스레드 생성과 댓글이, Vercel은 Slack 배포 모달이 동작하지 않는다"
  note: "같은 값이어야 하지만 서로 읽지 못해 따로 등록한다"

- name: GA4_SERVICE_ACCOUNT_JSON
  kind: secret
  stores: [github, vercel]
  consumers: [.github/workflows/daily-ga-report.yml, .github/workflows/weekly-ga-report.yml, .github/workflows/seo-monitor.yml, apps/web/src/modules/ga/config.ts]
  impact: "GitHub는 GA 리포트와 SEO Sheets 적재가, Vercel은 관리자 대시보드 활성 사용자 그래프가 동작하지 않는다(연결 없음으로 표시)"

- name: GA_SHEET_ID
  kind: secret
  stores: [github]
  required: false
  consumers: [.github/workflows/weekly-ga-report.yml]
  impact: "주간 GA 수치가 Google Sheets에 쌓이지 않는다(Slack 리포트는 그대로 가고 경고만 남는다)"
  note: "GA 전용 스프레드시트다. SEO 분석은 SEO_SHEET_ID 로 시트를 나눈다. URL의 /d/와 /edit 사이 ID를 등록하고 서비스 계정에 편집 권한을 준다"

- name: SEO_SHEET_ID
  kind: secret
  stores: [github]
  required: false
  consumers: [.github/workflows/seo-monitor.yml]
  impact: "SEO·GSC 장기 이력이 Google Sheets에 쌓이지 않는다(공개 SEO 검사와 원본 아티팩트는 유지된다)"
  note: "SEO 전용 스프레드시트다. GA 주간 수치(GA_SHEET_ID)와 나눠 쓴다"

- name: GSC_SERVICE_ACCOUNT_JSON
  kind: secret
  stores: [github]
  required: false
  consumers: [.github/workflows/seo-monitor.yml]
  impact: "없으면 공개 SEO 검사는 계속 실행되지만 Search Console 색인 상태와 주간 검색 성과 조회를 건너뛴다"
  note: "Web Memo Search Console 속성에 조회 권한을 부여한 전용 서비스 계정 JSON만 등록한다"

# ---------------------------------------------------------------------------
