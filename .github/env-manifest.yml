# 환경 변수 매니페스트: 어떤 변수가 어디에 등록돼 있어야 하는지의 원천입니다.
#
# 이름만 적습니다. 값은 절대 적지 않습니다.
#
# 이 파일과 대조하는 두 곳:
#   - PR CI(env-manifest.yml): 코드·워크플로가 읽는 이름, .env 파일의 키, docs 표를 대조합니다.
#   - 등록 현황 감사(env-registry-audit.yml): GitHub·Vercel·Supabase에 실제 등록된 이름을 대조합니다.
#     매일 돌아 다르면 Slack으로 알리고, PR에서도 돌아 등록이 빠진 값이 있으면 체크를 실패시킵니다.
#
# 값을 추가·삭제·이동했다면 이 파일을 함께 고치고 아래 명령으로 문서 표를 갱신하세요.
#   node .github/scripts/check-env-manifest.mjs --write
#
# 필드
#   kind       secret(비밀) | config(공개 설정값) | platform(플랫폼이 주입, 등록 안 함) | flag(코드가 읽지 않는 플랫폼 플래그)
#   stores     등록 위치. github | supabase | envpkg | vercel | vercel:production | vercel:preview | vercel:development
#              envpkg는 packages/env/.env.{환경}. vercel은 production·preview·development 세 환경 모두라는 뜻이고,
#              vercel:<환경>은 값이 환경마다 달라야 하는 예외(BUILD_ENV)에만 씁니다. 웹의 서버 시크릿은 Vercel이
#              원천이고 로컬은 development를 pnpm env:pull로 받아 쓰므로, 웹 값은 세 환경에 같게 등록합니다
#   consumers  이 값을 읽는 파일. 그 파일에 이름이 실제로 들어 있어야 합니다
#   impact     등록이 빠지면 생기는 일
#   required   false면 값이 없어도 코드가 기본값으로 동작하는 선택 값. 기본은 true
#   note       flag·platform의 사유
#
# 형식은 YAML의 부분집합입니다(- name: 으로 항목을 열고 두 칸 들여쓴 key: value). 값에 ": "나
# " #"가 들어가면 큰따옴표로 감싸세요. 줄 끝 주석은 지원하지 않습니다.

# ---------------------------------------------------------------------------
# GitHub Secrets: 배포 파이프라인이 외부 서비스에 인증하는 값
# ---------------------------------------------------------------------------

- name: TURBO_TOKEN
  kind: secret
  stores: [github]
  consumers: [.github/workflows/ci.yml, .github/workflows/cd-extension.yml, .github/workflows/cleanup-unused.yml, .github/workflows/e2e.yml]
  impact: "Turborepo 원격 캐시를 못 써 CI가 느려진다"

- name: TURBO_TEAM
  kind: secret
  stores: [github]
  consumers: [.github/workflows/ci.yml, .github/workflows/cd-extension.yml, .github/workflows/cleanup-unused.yml, .github/workflows/e2e.yml]
  impact: "Turborepo 원격 캐시 팀을 못 찾아 CI가 느려진다"

- name: VERCEL_TOKEN
  kind: secret
  stores: [github]
  consumers: [.github/workflows/cd-web.yml, .github/workflows/e2e.yml, .github/workflows/env-registry-audit.yml]
  impact: "vercel pull, build, deploy, alias가 인증에 실패해 웹 배포가 멈추고, e2e가 웹 서버 환경 변수를 받지 못한다"

- name: STAGING_WEB_URL_WITHOUT_PROTOCOL
