name: Supabase Operations Audit

# 저장소 선언과 운영 Supabase를 대조합니다. PR에서는 오류가 체크를 실패시키고,
# 정기·수동 실행에서는 경고를 포함한 모든 이상을 Slack으로 알립니다.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # UTC 23:00 = Asia/Seoul 08:00. 기존 GA·환경변수 감사와 겹치지 않습니다.
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: supabase-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Supabase 운영 상태 감사
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # 알림을 보낸 뒤 원래 종료 코드를 복원하기 위해 이 단계만 계속 진행합니다.
      - name: Audit Supabase
        id: audit
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node .github/scripts/supabase/audit-supabase.mjs --output "$RUNNER_TEMP/supabase-audit.json"

      - name: Notify findings
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_AUDIT_RESULT_PATH: ${{ runner.temp }}/supabase-audit.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/supabase/notify-supabase-audit.mjs

      - name: Fail on audit errors
        if: ${{ steps.audit.outcome == 'failure' }}
        run: exit 1
