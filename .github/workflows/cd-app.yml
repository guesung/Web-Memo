name: CD - App (iOS / Android Build + Store Submit)

on:
  workflow_call:
    inputs:
      deploy_target:
        description: "배포 대상 (build-only = 빌드 검증만, staging = 새 빌드 후 Android는 Firebase App Distribution·iOS는 TestFlight로 배포, production = 새 빌드 후 Play 내부 테스트·TestFlight로 제출)"
        type: string
        default: "build-only"
      ref:
        description: "체크아웃할 커밋/태그 (비우면 호출한 워크플로의 기본 ref)"
        type: string
        default: ""
      build_profile:
        description: "EAS 빌드 프로파일 (ci = 빌드 번호 자동 증가·스토어 제출 가능, verify = 버려지는 검증 빌드)"
        type: string
        default: "verify"
    outputs:
      attempted:
        description: "실제 앱 처리 또는 판정 실패 여부(생략된 후보는 false)"
        value: ${{ jobs.build-app.outputs.attempted }}

jobs:
  build-app:
    # 이 표시 이름은 notify-release-result.mjs가 플랫폼별 결과를 찾는 데 씁니다.
    # 바꾸면 스크립트의 매칭 문자열("ios 빌드" / "android 빌드")도 같이 고쳐야 합니다.
    name: ${{ matrix.platform }} 빌드
    runs-on: ${{ matrix.runner }}
    # 번호 증가부터 제출까지 같은 실행권을 유지합니다. 대기 요청은 최대 100개 보존합니다.
    concurrency:
      group: ${{ (inputs.deploy_target != 'build-only' || inputs.build_profile != 'verify') && 'release-app' || format('verify-app-{0}-{1}', github.ref, matrix.platform) }}
      cancel-in-progress: false
      queue: max
    outputs:
      attempted: ${{ inputs.deploy_target != 'staging' || steps.prepare.outputs.attempted == 'true' }}
    env:
      APP_PLATFORM: ${{ matrix.platform }}

      # PR 검증 빌드는 버려지는 산출물이라 빌드 번호를 올리면 안 됩니다(verify = autoIncrement off).
      # staging·production 배포는 번호를 올리고, master 빌드는 호출부가 ci를 넘깁니다.
      # staging의 Android는 Firebase App Distribution용 APK(staging 프로필)로 빌드하고,
      # 나머지(iOS TestFlight·production Play 제출)는 스토어 제출 가능한 ci 프로필로 빌드합니다.
      BUILD_PROFILE: ${{ inputs.deploy_target == 'staging' && (matrix.platform == 'android' && 'staging' || 'ci') || inputs.deploy_target == 'production' && 'ci' || inputs.build_profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Developer 계정 Program License Agreement 만료로 iOS 빌드 임시 제외.
          # 재동의 후 아래 항목을 복원하면 된다.
          # - platform: ios
          #   runner: macos-26
          - platform: android
            runner: ubuntu-26.04

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Android 릴리스는 master CI가 ci 프로파일로 이미 빌드해 올린 AAB가 있으면 그것을 제출만 합니다.
      # EAS 빌드가 약 30분이라 같은 커밋을 다시 빌드하는 비용이 릴리스 시간의 거의 전부입니다.
      # develop Android는 Play가 아니라 Firebase App Distribution으로 가므로, master 빌드를 재사용해도
      # Play에 더 낮은 versionCode로 제출될 일이 없습니다. 없으면(만료·앱 변경 없음·다른 ref) 새로 빌드합니다.
      # iOS는 develop도 TestFlight에 제출하므로 번호 역전을 막으려고 릴리스 때 항상 새로 빌드합니다.
      - name: Find reusable build
        id: reuse
        if: ${{ inputs.deploy_target == 'production' && matrix.platform == 'android' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # 프로파일을 이름에 넣어 찾습니다. develop 산출물(android-build-staging)과
          # PR 검증 산출물(android-build-verify)은 이 접두사에 걸리지 않습니다.
          ARTIFACT_PREFIX: ${{ matrix.platform }}-build-ci
        run: .github/scripts/deploy/find-reusable-artifact.sh

      - name: Download reusable build
        if: ${{ steps.reuse.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.reuse.outputs.run_id }}" \
            --name "${{ steps.reuse.outputs.name }}" \
            --dir apps/app

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # 공유 실행권을 얻은 뒤 검사합니다. 이후 푸시는 진행 중 빌드를 취소하지 않습니다.
      - name: Prepare staging app
        id: prepare
        if: ${{ inputs.deploy_target == 'staging' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/deploy/prepareStagingApp.mjs

      - name: Set up JDK
        if: ${{ (inputs.deploy_target != 'staging' || steps.prepare.outputs.should_build == 'true') && matrix.platform == 'android' && steps.reuse.outputs.found != 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: expo/expo-github-action@v9
        if: ${{ (inputs.deploy_target != 'staging' || steps.prepare.outputs.should_build == 'true') }}
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 빌드를 건너뛸 때도 설치는 합니다. eas submit이 프로젝트를 해석하는 데 필요합니다.
      - name: Install dependencies
        if: ${{ (inputs.deploy_target != 'staging' || steps.prepare.outputs.should_build == 'true') }}
        run: pnpm install --frozen-lockfile --prefer-offline

      # 산출물 파일명: iOS는 ipa, Android는 staging 프로필(APK)만 apk이고 나머지는 aab입니다.
      # 빌드 출력·아티팩트 업로드·스토어 제출·Firebase 배포가 이 값을 함께 씁니다.
      - name: Resolve build output
        run: |
          if [ "${{ matrix.platform }}" = "ios" ]; then
            echo "BUILD_OUTPUT=build.ipa" >> "$GITHUB_ENV"
          elif [ "$BUILD_PROFILE" = "staging" ]; then
            echo "BUILD_OUTPUT=build.apk" >> "$GITHUB_ENV"
          else
            echo "BUILD_OUTPUT=build.aab" >> "$GITHUB_ENV"
          fi

      # 서명 키는 EAS 서버에 등록된 것을 받아 쓰므로 러너에 별도 시크릿이 필요 없습니다.
      # ubuntu-26.04는 /tmp가 용량이 작은 tmpfs라, 로컬 빌드가 기본 작업 폴더(/tmp)를 쓰면
      # Gradle·CMake가 "Disk quota exceeded"로 죽습니다. 작업 폴더와 임시 파일을 디스크로 옮깁니다.
      - name: Build ${{ matrix.platform }}
        if: ${{ (inputs.deploy_target != 'staging' || steps.prepare.outputs.should_build == 'true') && steps.reuse.outputs.found != 'true' }}
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-build
          TMPDIR: ${{ runner.temp }}
        run: cd apps/app && eas build --platform ${{ matrix.platform }} --profile "$BUILD_PROFILE" --local --non-interactive --output "./$BUILD_OUTPUT"

      - name: Upload build artifact
        if: ${{ (inputs.deploy_target != 'staging' || steps.prepare.outputs.should_build == 'true') && steps.reuse.outputs.found != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          # develop 배포용 산출물을 master·PR 검증 산출물과 구분합니다(프로필이 staging이면 이미 이름에 들어갑니다).
          name: ${{ matrix.platform }}-build-${{ inputs.deploy_target == 'staging' && env.BUILD_PROFILE != 'staging' && 'staging-' || '' }}${{ env.BUILD_PROFILE }}
          path: apps/app/${{ env.BUILD_OUTPUT }}
          retention-days: 7

      - name: Write App Store Connect API key
        if: ${{ (inputs.deploy_target != 'staging' || steps.prepare.outputs.should_build == 'true') && (inputs.deploy_target == 'staging' || inputs.deploy_target == 'production') && matrix.platform == 'ios' }}
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: echo "$ASC_API_KEY_P8" > apps/app/asc-api-key.p8

      # Android는 production만 Play에 제출합니다. staging은 Firebase App Distribution으로 갑니다.
      - name: Write Google Play service account key
        if: ${{ inputs.deploy_target == 'production' && matrix.platform == 'android' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.EXPO_ANDROID_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > apps/app/play-service-account.json

      - name: Submit to store
        if: ${{ (inputs.deploy_target != 'staging' || steps.prepare.outputs.should_build == 'true') && ((matrix.platform == 'ios' && (inputs.deploy_target == 'staging' || inputs.deploy_target == 'production')) || (matrix.platform == 'android' && inputs.deploy_target == 'production')) }}
        run: cd apps/app && eas submit --platform ${{ matrix.platform }} --profile production --path "./$BUILD_OUTPUT" --non-interactive

      # 실패해도 넘어가지 않습니다(continue-on-error 없음): 배포가 안 됐는데 잡이 초록이면 안 됩니다.
      - name: Distribute to Firebase App Distribution
        if: ${{ inputs.deploy_target == 'staging' && steps.prepare.outputs.should_build == 'true' && matrix.platform == 'android' }}
        env:
          FIREBASE_ANDROID_APP_ID: "1:541718063018:android:ea2c32cbb48148403fedd3"
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          RELEASE_NOTES="$(git rev-parse --short HEAD) $(git log -1 --format=%s)"
          npx --yes firebase-tools@15.32.0 appdistribution:distribute "apps/app/$BUILD_OUTPUT" \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups testers \
            --release-notes "$RELEASE_NOTES"

      # 전체 CI가 실패·취소돼도 실제 앱 배포 성공 기준은 독립적으로 남습니다.
      - name: Record staging app deployment
        id: marker
        if: ${{ inputs.deploy_target == 'staging' && steps.prepare.outputs.should_build == 'true' }}
        env:
          APP_DEPLOYMENT_DIRECTORY: ${{ runner.temp }}/staging-app-${{ matrix.platform }}
        run: node .github/scripts/deploy/prepareStagingApp.mjs --record

      - name: Upload staging app success marker
        if: ${{ inputs.deploy_target == 'staging' && steps.prepare.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.marker.outputs.marker_name }}
          path: ${{ runner.temp }}/staging-app-${{ matrix.platform }}/deployment.json
          if-no-files-found: error
          retention-days: 90
