name: CD - App (iOS / Android Build + Store Submit)

on:
  workflow_call:
    inputs:
      deploy_target:
        description: "배포 대상 (build-only = 빌드 검증만, staging = 새 빌드 후 테스트 제출, production = 새 빌드 후 테스트 제출)"
        type: string
        default: "build-only"
      ref:
        description: "체크아웃할 커밋/태그 (비우면 호출한 워크플로의 기본 ref)"
        type: string
        default: ""
      build_profile:
        description: "EAS 빌드 프로파일 (ci = 빌드 번호 자동 증가·스토어 제출 가능, verify = 버려지는 검증 빌드)"
        type: string
        default: "verify"

jobs:
  build-app:
    # 이 표시 이름은 notify-release-result.mjs가 플랫폼별 결과를 찾는 데 씁니다.
    # 바꾸면 스크립트의 매칭 문자열("ios 빌드" / "android 빌드")도 같이 고쳐야 합니다.
    name: ${{ matrix.platform }} 빌드
    runs-on: ${{ matrix.runner }}
    env:
      # PR 검증 빌드는 버려지는 산출물이라 빌드 번호를 올리면 안 됩니다(verify = autoIncrement off).
      # staging·production 제출은 번호를 올리고, master 빌드는 호출부가 ci를 넘깁니다.
      BUILD_PROFILE: ${{ (inputs.deploy_target == 'staging' || inputs.deploy_target == 'production') && 'ci' || inputs.build_profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Developer 계정 Program License Agreement 만료로 iOS 빌드 임시 제외.
          # 재동의 후 아래 항목을 복원하면 된다.
          # - platform: ios
          #   runner: macos-26
          #   output: build.ipa
          - platform: android
            runner: ubuntu-26.04
            output: build.aab

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      # develop 제출보다 높은 빌드 번호가 필요하므로 production도 항상 새로 빌드합니다.
      # master CI 산출물을 재사용하면 더 낮은 versionCode로 제출할 수 있습니다.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Set up JDK
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # 서명 키는 EAS 서버에 등록된 것을 받아 쓰므로 러너에 별도 시크릿이 필요 없습니다.
      # ubuntu-26.04는 /tmp가 용량이 작은 tmpfs라, 로컬 빌드가 기본 작업 폴더(/tmp)를 쓰면
      # Gradle·CMake가 "Disk quota exceeded"로 죽습니다. 작업 폴더와 임시 파일을 디스크로 옮깁니다.
      - name: Build ${{ matrix.platform }}
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-build
          TMPDIR: ${{ runner.temp }}
        run: cd apps/app && eas build --platform ${{ matrix.platform }} --profile "$BUILD_PROFILE" --local --non-interactive --output ./${{ matrix.output }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          # develop 제출용 산출물을 master·PR 검증 산출물과 구분합니다.
          name: ${{ matrix.platform }}-build-${{ inputs.deploy_target == 'staging' && 'staging-' || '' }}${{ env.BUILD_PROFILE }}
          path: apps/app/${{ matrix.output }}
          retention-days: 7

      - name: Write App Store Connect API key
        if: ${{ (inputs.deploy_target == 'staging' || inputs.deploy_target == 'production') && matrix.platform == 'ios' }}
        env:
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: echo "$ASC_API_KEY_P8" > apps/app/asc-api-key.p8

      - name: Write Google Play service account key
        if: ${{ (inputs.deploy_target == 'staging' || inputs.deploy_target == 'production') && matrix.platform == 'android' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.EXPO_ANDROID_SERVICE_ACCOUNT_JSON }}
        run: echo "$PLAY_SERVICE_ACCOUNT_JSON" > apps/app/play-service-account.json

      - name: Submit to store
        if: ${{ inputs.deploy_target == 'staging' || inputs.deploy_target == 'production' }}
        run: cd apps/app && eas submit --platform ${{ matrix.platform }} --profile production --path ./${{ matrix.output }} --non-interactive
