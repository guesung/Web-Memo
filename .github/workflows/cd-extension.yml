name: CD - Extension (Build + Chrome Store Upload)

on:
  workflow_call:
    inputs:
      deploy_target:
        description: "배포 대상 (none = 빌드만, production = 크롬 웹스토어 업로드)"
        type: string
        default: "none"
      ref:
        description: "체크아웃할 커밋/태그 (비우면 호출한 워크플로의 기본 ref)"
        type: string
        default: ""

jobs:
  build-extension:
    name: 확장 빌드
    runs-on: ubuntu-latest
    outputs:
      zip_name: ${{ steps.zip.outputs.name }}
    env:
      BUILD_ENV: ${{ inputs.deploy_target == 'staging' && 'staging' || 'production' }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # 스토어에 올릴 커밋은 master CI에서 이미 production으로 빌드돼 아티팩트로
      # 올라가 있습니다(BUILD_ENV가 staging이 아니면 production이라 같은 산출물입니다).
      # 있으면 그것을 내려받아 쓰고, 없으면(만료·확장 변경 없음) 아래에서 새로 빌드합니다.
      - name: Find reusable build
        id: reuse
        if: ${{ inputs.deploy_target == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PREFIX: extension-production-
        run: .github/scripts/find-reusable-artifact.sh

      - name: Download reusable build
        if: ${{ steps.reuse.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.reuse.outputs.run_id }}" \
            --name "${{ steps.reuse.outputs.name }}" \
            --dir dist-zip

      - uses: pnpm/action-setup@v4
        if: ${{ steps.reuse.outputs.found != 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ steps.reuse.outputs.found != 'true' }}
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: ${{ steps.reuse.outputs.found != 'true' }}
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        if: ${{ steps.reuse.outputs.found != 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm run build:extension

      - name: Zip the build files
        if: ${{ steps.reuse.outputs.found != 'true' }}
        run: pnpm run zip

      # zip 이름에 환경과 버전이 들어갑니다(extension-production-v1.10.14.zip).
      # 아티팩트 이름도 같이 맞춰야 다운로드한 파일만 보고 무엇인지 알 수 있습니다.
      # 새로 빌드했든 CI 아티팩트를 내려받았든 dist-zip에 zip 하나가 있는 것은 같아
      # 아래 두 스텝은 양쪽 경로에서 그대로 돕니다.
      - name: Resolve zip name
        id: zip
        run: |
          shopt -s nullglob
          files=(dist-zip/*.zip)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::dist-zip에 zip이 정확히 1개가 아닙니다: ${files[*]:-(없음)}"
            exit 1
          fi
          name="$(basename "${files[0]}" .zip)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "zip: $name.zip"

      - name: Upload Extension
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist-zip/${{ steps.zip.outputs.name }}.zip

  upload-extension:
    needs: build-extension
    runs-on: ubuntu-latest
    name: 크롬 웹스토어 업로드
    if: ${{ inputs.deploy_target == 'production' }}
    steps:
      # 이름을 지정하면 아티팩트 내용물이 하위 디렉터리 없이 그대로 풀립니다.
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-extension.outputs.zip_name }}

      - name: Upload zipped file on chrome store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ needs.build-extension.outputs.zip_name }}.zip
          extension-id: eaiojpmgklfngpjddhoalgcpkepgkclh
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: false
