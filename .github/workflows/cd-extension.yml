name: CD - Extension (Build + Chrome Store Upload)

on:
  workflow_call:
    inputs:
      deploy_target:
        description: "배포 대상 (none = 빌드만, production = 크롬 웹스토어 업로드)"
        type: string
        default: "none"
      ref:
        description: "체크아웃할 커밋/태그 (비우면 호출한 워크플로의 기본 ref)"
        type: string
        default: ""

jobs:
  build-extension:
    runs-on: ubuntu-latest
    env:
      WEB_URL: ${{ inputs.deploy_target == 'staging' && secrets.STAGING_WEB_URL || secrets.PROD_WEB_URL }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setting environment variables
        run: |
          echo WEB_URL=${{ env.WEB_URL }} >> packages/env/.env
          echo NODE_ENV=production >> packages/env/.env

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: pnpm run build:extension

      - name: Zip the build files
        run: pnpm run zip

      - name: Upload Extension
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist-zip/extension.zip

  upload-extension:
    needs: build-extension
    runs-on: ubuntu-latest
    name: Upload chrome store on production release
    if: ${{ inputs.deploy_target == 'production' }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Upload zipped file on chrome store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension/extension.zip
          extension-id: eaiojpmgklfngpjddhoalgcpkepgkclh
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: false
