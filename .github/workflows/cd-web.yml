name: CD - Web (Build + Vercel Deploy)

on:
  workflow_call:
    inputs:
      deploy_target:
        description: "배포 대상 (build-only = staging으로 빌드만, staging = 스테이징 배포, staged = 상용 환경으로 빌드해 도메인 없이 올려두기, production = 프로덕션 배포)"
        type: string
        default: "build-only"
      ref:
        description: "체크아웃할 커밋/태그 (비우면 호출한 워크플로의 기본 ref)"
        type: string
        default: ""
    outputs:
      # ci.yml의 notify-staging 잡이 테섭 배포 결과를 스레드에 알릴 때 씁니다.
      # 값은 success·failure·skipped입니다. skipped는 배포 스텝 앞에서 멈췄다는 뜻입니다.
      staging_outcome:
        description: "스테이징 배포 스텝의 결과 (success, failure, skipped)"
        value: ${{ jobs.build-web.outputs.staging_outcome }}

  # ci.yml이 부르는 경로에는 배포가 조용히 스킵되는 틈이 있습니다. CI가 실패한
  # 커밋의 변경분은 배포되지 못한 채 지나가고, 다음 커밋의 affected 판정은 직전
  # 커밋만 기준으로 삼아 그 변경분을 다시 잡지 않습니다. 실패가 아니라 스킵이라
  # 알림도 뜨지 않으므로, 사람이 손으로 밀어 넣을 수 있는 문을 둡니다.
  # production을 뺀 것은 의도입니다 — 실제 배포는 release.yml 한 경로로 유지합니다.
  # staged는 상용에 올려만 두고 도메인을 붙이지 않으므로 라이브에 영향이 없어 열어 둡니다.
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "배포 대상"
        type: choice
        options:
          - build-only
          - staging
          - staged
        default: "build-only"
      ref:
        description: "체크아웃할 커밋/태그 (비우면 실행한 브랜치)"
        type: string
        default: ""

jobs:
  build-web:
    name: 웹 빌드·배포
    runs-on: ubuntu-24.04
    outputs:
      staging_outcome: ${{ steps.deploy-staging.outcome }}
    env:
      # 아래 Vercel Pull·Build와 같은 기준으로 판정해야 합니다. production과 staged는 상용 환경으로,
      # build-only·staging은 Preview 환경으로 굽습니다. 기준이 갈리면 build-only가 양쪽에서 다른 쪽으로 떨어져,
      # 상수는 production인데 Vercel 값은 Preview인 조합이 됩니다.
      # (Vercel Pull·Build는 아래 USE_PRODUCTION_ENV 하나만 봅니다.)
      BUILD_ENV: ${{ (inputs.deploy_target == 'production' || inputs.deploy_target == 'staged') && 'production' || 'staging' }}
      USE_PRODUCTION_ENV: ${{ inputs.deploy_target == 'production' || inputs.deploy_target == 'staged' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 아래 Vercel Build와 같은 기준으로 환경을 골라야 짝이 맞습니다.
      # staging은 --prod 없이 빌드해 Preview로 나가므로 Preview 환경 값을 받습니다.
      # --environment를 비우면 Development 값을 받아, Production에만 등록된 값이
      # 빠진 채로 빌드와 배포가 그냥 성공합니다.
      - name: Vercel Pull
        run: vercel pull --yes --environment=${{ env.USE_PRODUCTION_ENV == 'true' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      # 릴리스(production)는 먼저 이 커밋의 미승격 배포를 찾습니다. master CI가 머지 때 상용 환경으로 굽고
      # 도메인 없이 올려 둔 것(staged)이며, 있으면 아래 빌드를 통째로 건너뛰고 승격만 합니다.
      # 못 찾거나 조회에 실패하면 found가 false라 지금처럼 빌드해서 배포합니다.
      - name: Find staged deployment
        id: staged
        if: ${{ inputs.deploy_target == 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: SHA="$(git rev-parse HEAD)" node .github/scripts/deploy/find-staged-deployment.mjs

      - name: Cache Next.js build
        if: ${{ steps.staged.outputs.found != 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml', 'apps/web/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        if: ${{ steps.staged.outputs.found != 'true' }}
        run: pnpm install --frozen-lockfile --prefer-offline

      # 런타임·빌드 환경 변수는 vercel pull이 받아온 Vercel 프로젝트 설정을 씁니다.
      # 셸로 덧씌우면 등록되지 않은 시크릿이 빈 값으로 덮어쓸 수 있습니다.
      - name: Vercel Build
        if: ${{ steps.staged.outputs.found != 'true' }}
        run: vercel build ${{ env.USE_PRODUCTION_ENV == 'true' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy staging
        id: deploy-staging
        if: ${{ inputs.deploy_target == 'staging' }}
        run: |
          VERCEL_DEPLOYED_URL="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          vercel alias set "$VERCEL_DEPLOYED_URL" ${{ secrets.STAGING_WEB_URL_WITHOUT_PROTOCOL }} --token=${{ secrets.VERCEL_TOKEN }} --scope=gueit214s-projects

      # develop 푸시로 ci.yml이 부른 경우의 테섭 배포 결과는 ci.yml의 notify-staging 잡이
      # 이 잡의 staging_outcome output을 받아 스레드에 알립니다. 잡을 나눠도 앱 빌드(약 30분)를
      # 기다리지 않습니다 — notify-staging은 cd-web만 needs로 걸기 때문입니다.
      #
      # 이 스텝은 workflow_dispatch로 직접 실행한 경우에만 돕니다. 그 경로는 ci.yml의
      # 잡을 거치지 않아 스레드도 notify-staging도 없으므로 여기서 웹훅으로 알립니다.
      # (workflow_call로 불렸을 때의 github.event_name은 호출한 쪽의 이벤트라 push입니다.)
      #
      # 이 잡이 아예 안 도는 경우(웹 변경 없음)에는 알리지 않습니다. 올라간 것이 없으면
      # 알릴 것도 없습니다. 프로덕션 배포는 release.yml의 notify가 따로 보고합니다.
      - name: Notify staging deploy
        # 배포가 깨졌을 때야말로 알려야 하므로 실패해도 돌립니다(!cancelled()는 실패를 통과시킵니다).
        # 취소만 뺍니다. develop은 cancel-in-progress라 푸시가 연달으면 앞선 run이 매번 취소되는데,
        # 뒤이은 run이 어차피 배포하고 그 결과를 다시 알리므로 취소 알림은 소음만 됩니다.
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'staging' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 배포 스텝의 outcome만으로는 "배포하다 실패"와 "빌드에서 멈춰 배포까지 못 감"이
          # 둘 다 실패로 뭉개집니다. skipped는 앞 스텝에서 멈췄다는 뜻입니다.
          DEPLOY_OUTCOME: ${{ steps.deploy-staging.outcome }}
        run: node .github/scripts/deploy/notify-staging-deploy.mjs

      # master 머지분을 상용 환경으로 굽고 도메인은 붙이지 않은 채 올려 둡니다(--skip-domain).
      # 라이브는 그대로이고, Slack의 웹 배포 버튼이 이 배포를 승격합니다. 어느 커밋의 배포인지는
      # 메타 releaseSha로 찾습니다(.github/scripts/deploy/staged-deployment.mjs).
      - name: Deploy staged (미승격)
        if: ${{ inputs.deploy_target == 'staged' }}
        run: |
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --skip-domain -m releaseSha="$(git rev-parse HEAD)" --token=${{ secrets.VERCEL_TOKEN }})"
          echo "미승격 배포: $DEPLOYMENT_URL"
          echo "미승격 배포(라이브 아님): $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

      # 미승격 배포가 있으면 재빌드 없이 승격만 합니다. 환경변수는 그 배포를 만든 시점의 값입니다.
      - name: Promote staged deployment
        if: ${{ steps.staged.outputs.found == 'true' }}
        env:
          STAGED_URL: ${{ steps.staged.outputs.url }}
        run: |
          vercel promote "$STAGED_URL" --yes --token=${{ secrets.VERCEL_TOKEN }}
          echo "미승격 배포를 승격했습니다: $STAGED_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production
        if: ${{ inputs.deploy_target == 'production' && steps.staged.outputs.found != 'true' }}
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          echo "미승격 배포가 없어 새로 빌드해 배포했습니다" >> "$GITHUB_STEP_SUMMARY"
