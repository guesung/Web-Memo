name: CD - Web (Build + Vercel Deploy)

on:
  workflow_call:
    inputs:
      deploy_target:
        description: "배포 대상 (none = 빌드만, staging = 스테이징 배포, production = 프로덕션 배포)"
        type: string
        default: "none"
      ref:
        description: "체크아웃할 커밋/태그 (비우면 호출한 워크플로의 기본 ref)"
        type: string
        default: ""

jobs:
  build-web:
    name: 웹 빌드·배포
    runs-on: ubuntu-latest
    env:
      # 아래 Vercel Pull·Build와 같은 기준(== 'production')으로 판정해야 합니다.
      # deploy_target은 none·staging·production 셋인데 기준이 갈리면 none이 양쪽에서
      # 다른 쪽으로 떨어져, 상수는 production인데 Vercel 값은 Preview인 조합이 됩니다.
      BUILD_ENV: ${{ inputs.deploy_target == 'production' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml', 'apps/web/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # 아래 Vercel Build와 같은 기준으로 환경을 골라야 짝이 맞습니다.
      # staging은 --prod 없이 빌드해 Preview로 나가므로 Preview 환경 값을 받습니다.
      # --environment를 비우면 Development 값을 받아, Production에만 등록된 값이
      # 빠진 채로 빌드와 배포가 그냥 성공합니다.
      - name: Vercel Pull
        run: vercel pull --yes --environment=${{ inputs.deploy_target == 'production' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      # 런타임·빌드 환경 변수는 vercel pull이 받아온 Vercel 프로젝트 설정을 씁니다.
      # 셸로 덧씌우면 등록되지 않은 시크릿이 빈 값으로 덮어쓸 수 있습니다.
      - name: Vercel Build
        run: vercel build ${{ inputs.deploy_target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy staging
        id: deploy-staging
        if: ${{ inputs.deploy_target == 'staging' }}
        run: |
          VERCEL_DEPLOYED_URL="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          vercel alias set "$VERCEL_DEPLOYED_URL" ${{ secrets.STAGING_WEB_URL_WITHOUT_PROTOCOL }} --token=${{ secrets.VERCEL_TOKEN }} --scope=gueit214s-projects

      # 배포한 이 잡에서 바로 알립니다. 별도 잡으로 빼면 needs가 정적이라 앱 빌드(약 30분)를
      # 기다리게 되고, develop 푸시에서는 apps/app과 apps/web이 @web-memo/shared를 함께 써
      # 그 대기가 흔하게 걸립니다. 여기서는 배포 직후 곧바로 나갑니다.
      #
      # 이 잡이 아예 안 도는 경우(웹 변경 없음)에는 알리지 않습니다. 올라간 것이 없으면
      # 알릴 것도 없습니다. 프로덕션 배포는 release.yml의 notify가 따로 보고합니다.
      - name: Notify staging deploy
        # 배포가 깨졌을 때야말로 알려야 하므로 always()입니다.
        if: ${{ always() && inputs.deploy_target == 'staging' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 배포 스텝의 outcome만으로는 "배포하다 실패"와 "빌드에서 멈춰 배포까지 못 감"이
          # 둘 다 실패로 뭉개집니다. 잡 상태를 함께 넘겨 스크립트가 갈라 읽습니다.
          DEPLOY_OUTCOME: ${{ steps.deploy-staging.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: node .github/scripts/notify-staging-deploy.mjs

      - name: Deploy production
        if: ${{ inputs.deploy_target == 'production' }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
