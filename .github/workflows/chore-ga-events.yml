name: GA events maintenance

on:
  schedule:
    # E2E 보강(일요일 10:23 KST)·리팩토링 점검(토요일)과 겹치지 않도록 수요일 아침에 실행합니다.
    - cron: "41 0 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "분석과 검증까지만 실행하고 PR은 만들지 않습니다"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: chore-ga-events
  cancel-in-progress: false

jobs:
  maintain:
    # 모델이 쓴 코드를 실행하는 작업입니다. 쓰기 권한 토큰과 서버 시크릿을 주지 않습니다.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_ready: ${{ steps.export_patch.outputs.ready }}
      patch_sha256: ${{ steps.export_patch.outputs.patch_sha256 }}
      candidate_sha256: ${{ steps.export_patch.outputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Prepare run directory
        run: |
          mkdir -p "$RUNNER_TEMP/ga-events"
          echo "GA_EVENTS_DIR=$RUNNER_TEMP/ga-events" >> "$GITHUB_ENV"
          echo "GA_EVENTS_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Skip when a GA events PR is already open
        id: precheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ga-events/maintain.mjs precheck

      - name: Prepare analysis context
        id: context
        if: steps.precheck.outputs.proceed == 'true'
        run: node .github/scripts/ga-events/maintain.mjs context

      - name: Find missing GA events
        id: analyze
        if: steps.precheck.outputs.proceed == 'true'
        uses: anthropics/claude-code-action/base-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read AGENTS.md, docs/events.md, docs/analytics.md, packages/shared/src/modules/analytics/type.ts and ${{ steps.context.outputs.context_file }}.
            Find user actions that have no GA4 event yet and whose usage the team could not tell without one.
            Start from context.recentFiles (changed in the last 14 days), then check context.flows. Inspect the real components before deciding.
            An action is a gap only if ALL hold: a real user-visible action exists in tracked source, no existing event in context.existingEvents already answers the same question, and you can state the product question the event answers.
            Never invent a near-duplicate of an existing event. Variants of the same action are separated by properties of the existing event, so do not propose those.
            Propose at most 2 events. Fewer is better: a wrong event leaves data that cannot be deleted. If nothing qualifies, return status=none.
            Event names are snake_case in object_verb form. properties lists at most 5 bare snake_case keys only, for example ["candidate_count"]. Never put types, descriptions or punctuation in a key; explain the meaning in trigger or question instead. Values are length, count, boolean or enum only.
            Never use properties that carry email, name, phone, token, password, or text the user typed (memo body, search query, feedback text, urls).
            category is core_action for using the service, engagement for navigation or settings around it.
            Each event lists files: the tracked product source files (not tests, not type.ts) where the call will be added, at most 5.
            Do not modify files. Return only the required JSON object. For status=none return events as an empty array and explain in reason.
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 20
            --allowedTools "Read,Grep,Glob"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"status":{"type":"string","enum":["gap","none"]},"reason":{"type":"string"},"events":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"name":{"type":"string"},"category":{"type":"string","enum":["engagement","core_action"]},"trigger":{"type":"string"},"question":{"type":"string"},"properties":{"type":"array","items":{"type":"string","pattern":"^[a-z][a-z0-9_]*$"}},"files":{"type":"array","items":{"type":"string"}}},"required":["name","category","trigger","question","properties","files"]}}},"required":["status","reason","events"]}'

      - name: Validate analysis result
        id: candidate
        if: steps.precheck.outputs.proceed == 'true'
        env:
          GA_EVENTS_CANDIDATE_JSON: ${{ steps.analyze.outputs.structured_output }}
        run: node .github/scripts/ga-events/maintain.mjs candidate

      - name: Add the events
        id: write_events
        if: steps.candidate.outputs.status == 'gap'
        uses: anthropics/claude-code-action/base-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read AGENTS.md, docs/events.md, docs/analytics.md and ${{ runner.temp }}/ga-events/candidate.json.
            Add exactly the approved events and nothing else:
            1. packages/shared/src/modules/analytics/type.ts: add each event to the TAnalyticsEvent union and to EVENT_CATEGORY with the approved category. Do not edit or remove existing entries.
            2. Add one analytics.trackEvent call per event, only in the files listed in that event's files. Follow the surrounding call sites and conventions in AGENTS.md. Do not use useCallback or useMemo. Biome rules are errors in CI: include every value used inside a hook in its dependency array, avoid non-null assertions and array-index keys. Prefer firing the event from the user's event handler.
            3. docs/events.md: add one row per event (발생 시점, 속성, 답하려는 질문; 추가된 작업 is —). Keep the table format.
            4. docs/analytics.md: list each event under its category with its properties and update the event count in the heading and in any sentence that states it.
            Do not edit tests, config, workflows or any other file. Do not create files. Do not commit or publish anything.
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit"

      - name: Check generated changes
        id: changes
        if: steps.candidate.outputs.status == 'gap'
        run: node .github/scripts/ga-events/maintain.mjs changes

      # claude-code-action/base-action이 내부에서 Node 18을 설정해 이후 단계가 Node 18로 돕니다(jsdom 30이 ERR_REQUIRE_ESM으로 깨짐). AI 단계가 끝난 뒤 .nvmrc 버전으로 되돌립니다.
      - name: Restore Node for verification
        if: steps.candidate.outputs.status == 'gap'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.candidate.outputs.status == 'gap'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify changes
        id: verify_initial
        if: steps.candidate.outputs.status == 'gap'
        continue-on-error: true
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          set -euo pipefail
          exec > >(tee "$GA_EVENTS_DIR/verification-initial.log") 2>&1
          .github/scripts/ga-events/verify.sh

      - name: Fix verification failure once
        id: fix_events
        if: steps.candidate.outputs.status == 'gap' && steps.verify_initial.outcome == 'failure'
        uses: anthropics/claude-code-action/base-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read ${{ runner.temp }}/ga-events/candidate.json and ${{ runner.temp }}/ga-events/verification-initial.log.
            Fix the failure once. You may only edit files that are already modified (git diff --name-only) and only to make the log's errors pass.
            Keep exactly the approved events. Do not add, rename or remove events, and do not touch tests, config, workflows or other files.
            Biome rules are errors here: include every value used inside a hook in its dependency array, avoid non-null assertions and array-index keys. Do not use useCallback or useMemo.
            Do not create files. Do not commit or publish anything.
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Edit"

      - name: Restore Node after correction
        if: steps.fix_events.outcome == 'success'
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Verify corrected changes
        id: verify_retry
        if: steps.fix_events.outcome == 'success'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          set -euo pipefail
          exec > >(tee "$GA_EVENTS_DIR/verification-retry.log") 2>&1
          .github/scripts/ga-events/verify.sh

      - name: Reject unverified changes
        if: steps.candidate.outputs.status == 'gap' && steps.verify_initial.outcome != 'success' && steps.verify_retry.outcome != 'success'
        run: exit 1

      - name: Export the verified patch
        id: export_patch
        if: steps.candidate.outputs.status == 'gap' && (steps.verify_initial.outcome == 'success' || steps.verify_retry.outcome == 'success')
        run: node .github/scripts/ga-events/maintain.mjs export-patch

      - name: Transfer patch to isolated publisher
        if: steps.export_patch.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ga-events-patch
          path: ${{ runner.temp }}/ga-events/publish-artifact/
          if-no-files-found: error
          retention-days: 1

      - name: Summarize result
        if: always()
        env:
          GA_EVENTS_RUN_STATUS: ${{ job.status }}
          GA_EVENTS_DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/ga-events/maintain.mjs summary

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ga-events-evidence
          path: ${{ runner.temp }}/ga-events/
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is unavailable"
            exit 0
          fi
          payload=$(node -e 'process.stdout.write(JSON.stringify({text: `❌ 주간 GA 이벤트 점검 실패: <${process.env.RUN_URL}|실행 로그 보기>`}))')
          curl --silent --show-error --fail-with-body --header 'content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

  publish:
    needs: maintain
    if: needs.maintain.outputs.artifact_ready == 'true' && inputs.dry_run != true && github.ref_name == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # 모델이 바꾼 스크립트·Git 설정을 가져오지 않도록 새 러너에서 패치만 받아 다시 검증합니다.
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Prepare trusted publisher
        run: |
          mkdir -p "$RUNNER_TEMP/ga-events"
          echo "GA_EVENTS_DIR=$RUNNER_TEMP/ga-events" >> "$GITHUB_ENV"
          echo "GA_EVENTS_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v6
        with:
          name: ga-events-patch
          path: ${{ runner.temp }}/ga-events-staging

      - name: Safely import and revalidate the patch
        env:
          GA_EVENTS_ARTIFACT_DIR: ${{ runner.temp }}/ga-events-staging
          GA_EVENTS_EXPECTED_PATCH_SHA256: ${{ needs.maintain.outputs.patch_sha256 }}
          GA_EVENTS_EXPECTED_CANDIDATE_SHA256: ${{ needs.maintain.outputs.candidate_sha256 }}
        run: node .github/scripts/ga-events/maintain.mjs import-patch

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify in isolated checkout
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          pnpm check
          pnpm type-check
          pnpm exec vitest run packages/shared/src/modules/analytics

      - name: Create GitHub App token after independent validation
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish one PR
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: node .github/scripts/ga-events/maintain.mjs publish

      - name: Summarize publication
        if: always()
        env:
          GA_EVENTS_RUN_STATUS: ${{ job.status }}
        run: node .github/scripts/ga-events/maintain.mjs summary

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ga-events-publication-evidence
          path: ${{ runner.temp }}/ga-events/
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is unavailable"
            exit 0
          fi
          payload=$(node -e 'process.stdout.write(JSON.stringify({text: `❌ GA 이벤트 PR 게시 실패: <${process.env.RUN_URL}|실행 로그 보기>`}))')
          curl --silent --show-error --fail-with-body --header 'content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
