name: Chore - Oracle VM 생성 재시도

# Oracle Cloud 오사카의 무료 A1 VM(webmemo-1)은 "Out of host capacity"로 자주 생성이 막힙니다.
# 10분마다 infra/oracle/scripts/launch-vm.sh를 불러 자리가 날 때까지 다시 시도하고,
# 만들어지면 Slack으로 알린 뒤 이 워크플로를 스스로 끕니다(노션 DB-1327 이전 계획 1단계).
# VM이 회수돼 다시 만들어야 하면 Actions에서 이 워크플로를 다시 켜면 됩니다.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# 앞선 실행이 아직 생성을 시도 중이면 겹쳐서 요청 한도(429)에 걸리지 않게 줄 세웁니다.
concurrency:
  group: oracle-vm-retry
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  launch:
    name: VM 생성 시도
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: infra/oracle

      - name: Install OCI CLI
        run: pipx install oci-cli

      # 비밀은 파일로만 씁니다. 로그에 남지 않게 printf로 넘깁니다.
      - name: Configure OCI CLI
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          ORACLE_SSH_PUBLIC_KEY: ${{ secrets.ORACLE_SSH_PUBLIC_KEY }}
        run: |
          install -d -m 700 ~/.oci
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > ~/.oci/key.pem
          printf '%s\n' "$ORACLE_SSH_PUBLIC_KEY" > ~/.oci/ssh.pub
          cat > ~/.oci/config <<CONFIG
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=ap-osaka-1
          key_file=$HOME/.oci/key.pem
          CONFIG
          chmod 600 ~/.oci/*

      - name: Launch
        id: launch
        env:
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          SSH_PUBLIC_KEY_FILE: /home/runner/.oci/ssh.pub
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          infra/oracle/scripts/launch-vm.sh | tee "$RUNNER_TEMP/launch.log"
          grep '^RESULT=' "$RUNNER_TEMP/launch.log" | tail -1 | sed 's/^RESULT=/result=/' >> "$GITHUB_OUTPUT"
          echo "결과: $(grep '^RESULT=' "$RUNNER_TEMP/launch.log" | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      # 만들어졌으면 공인 IP가 붙을 때까지 기다렸다가 알립니다.
      - name: Notify Slack
        if: ${{ steps.launch.outputs.result == 'created' || steps.launch.outputs.result == 'exists' }}
        env:
          OCI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ steps.launch.outputs.result }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
          SUPPRESS_LABEL_WARNING: "True"
        run: |
          ID=$(oci compute instance list -c "$OCI_TENANCY" --display-name webmemo-1 --query 'data[0].id' --raw-output)
          IP=""
          for _ in $(seq 1 20); do
            IP=$(oci compute instance list-vnics --instance-id "$ID" --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
            [ -n "$IP" ] && [ "$IP" != "null" ] && break
            sleep 15
          done
          TEXT="Oracle VM webmemo-1 준비($RESULT): 공인 IP ${IP:-확인 실패}. 다음: ORACLE_SSH_* 등록 후 cd-web-oracle 수동 실행. 재시도 워크플로는 껐습니다."
          curl -fsS -X POST -H 'content-type: application/json' \
            --data "$(jq -n --arg text "$TEXT" '{text: $text}')" "$SLACK_WEBHOOK_URL"
          echo "$TEXT" >> "$GITHUB_STEP_SUMMARY"

      - name: Disable this workflow
        if: ${{ steps.launch.outputs.result == 'created' || steps.launch.outputs.result == 'exists' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable chore-oracle-vm-retry.yml --repo "$GITHUB_REPOSITORY"
