name: CI

# required status check로 등록하려면 잡이 모든 PR에서 실행돼야 합니다.
# paths로 걸러 잡이 아예 뜨지 않으면 체크가 "대기중"에 머물러 머지가 영영 막힙니다.
# labeled/unlabeled는 PR을 연 뒤 build-app 라벨을 붙여도 앱 빌드가 돌게 하려고 받습니다.
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# master는 커밋마다 CI를 병렬로 끝까지 돌립니다. 그룹을 ref 단위로 두면 push가 연달아 들어올 때
# GitHub이 대기 run을 하나만 남기고 앞선 대기 run을 cancel-in-progress와 상관없이 취소합니다.
# 취소된 run은 잡이 하나도 뜨지 않아 그 커밋은 CI 검증도 Slack 알림도 없이 사라집니다(PR #517).
# master의 이 CI는 배포하지 않고 빌드 검증·아티팩트·알림만 하므로 병렬로 돌려도 배포가 겹치지 않습니다.
# PR과 develop은 종전처럼 같은 ref의 앞선 run을 취소합니다.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      # 이벤트에서 읽은 base 브랜치명은 로컬 ref가 없어 해석에 실패하고,
      # --affected가 조용히 "전부 변경됨"으로 폴백합니다. 그래서 기준을 명시합니다.
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Package boundaries
        run: pnpm exec turbo boundaries --filter="./packages/*"

      - name: Check (format + lint)
        run: pnpm check

      - name: Type check (affected only)
        run: pnpm exec turbo type-check --affected

      - name: Unit tests
        run: pnpm test:jest --run

  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.detect.outputs.app }}
      extension: ${{ steps.detect.outputs.extension }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          # turbo가 base와 비교하려면 전체 히스토리가 필요합니다.
          fetch-depth: 0

      # 판정은 turbo 바이너리만 쓰므로 pnpm install이 필요 없습니다(러너 기본 node로 5초).
      - id: detect
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
        run: .github/scripts/detect-affected-apps.sh

  # 푸시 직후 Slack 스레드의 루트 메시지를 만들고 그 ts를 냅니다. 뒤이은 알림 잡들이 댓글을 답니다.
  #
  # 이 잡은 cd-*의 needs에 넣지 않습니다. 넣으면 PR 이벤트에서 이 잡이 skipped이거나 실패했을 때
  # cd-*가 암묵적 success() 조건 때문에 통째로 skipped됩니다. 알림은 배포 여부에 영향을 주면 안 됩니다.
  # 다른 잡을 기다리지 않고(needs 없음) 바로 시작합니다.
  slack-thread:
    name: Slack 스레드 루트
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      thread_ts: ${{ steps.root.outputs.thread_ts }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # 토큰·채널이 없거나 전송이 실패하면 thread_ts는 빈 값이 되고 경고만 남습니다(exit 0).
      - id: root
        name: Create thread root
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: node .github/scripts/notify-thread-root.mjs

  # 앱 빌드는 약 30분입니다. packages/shared를 웹·확장이 함께 써서
  # 앱과 무관한 PR까지 빌드를 끌고 오므로, PR에서는 build-app 라벨이 있을 때만 돌립니다.
  cd-app:
    needs: [ci, changes]
    # 재사용 워크플로의 잡은 호출자 권한을 넘어설 수 없습니다.
    # cd-app.yml은 체크아웃만 하므로 contents:read면 충분합니다.
    permissions:
      contents: read
    if: >-
      needs.changes.outputs.app == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-app'))
    uses: ./.github/workflows/cd-app.yml
    secrets: inherit
    with:
      # master에 머지돼도 자동으로 스토어에 올리지 않습니다. 여기서는 빌드가 되는지만 봅니다.
      # 실제 제출은 아래 notify가 보낸 Slack 메시지의 버튼 → release.yml 한 경로뿐입니다.
      # (docs/release-flow.md)
      deploy_target: "none"
      # master 머지분은 release.yml이 그대로 내려받아 제출하므로 스토어에 올릴 수 있는
      # 빌드여야 합니다(ci = autoIncrement on). PR 검증 빌드는 버려지므로 verify입니다.
      build_profile: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'ci' || 'verify' }}

  cd-extension:
    needs: [ci, changes]
    if: needs.changes.outputs.extension == 'true'
    uses: ./.github/workflows/cd-extension.yml
    secrets: inherit
    with:
      # develop 머지분은 staging으로 빌드합니다. 그래야 artifact zip을 받아 로드했을 때
      # 콘솔 로거와 debug_mode가 켜져 로깅이 실제로 나가는지 확인할 수 있습니다.
      # 스토어 업로드 잡은 production일 때만 도므로 게시에는 영향이 없습니다.
      deploy_target: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') && 'staging' || 'none' }}

  cd-web:
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/cd-web.yml
    secrets: inherit
    with:
      # develop 푸시는 테섭에 배포하고, master 푸시는 상용 환경으로 빌드해 도메인 없이 올려 둡니다(staged).
      # staged는 라이브를 바꾸지 않습니다. Slack의 웹 배포 버튼(release.yml)이 그 배포를 재빌드 없이
      # 승격합니다. PR은 검증 빌드만 합니다. (docs/release-flow.md)
      deploy_target: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' && 'staging' || 'staged') || 'none' }}

  # develop 푸시의 테섭 배포 결과를 머지 스레드에 댓글로 답니다.
  # cd-web만 기다리므로 앱 빌드(약 30분)와 무관하게 배포 직후 나갑니다.
  # slack-thread는 알림용 needs입니다. 실패·스킵돼도 always()라 이 잡은 돌고,
  # 그때는 thread_ts가 비어 스크립트가 웹훅 최상위 메시지로 내려갑니다.
  # cd-web이 success·failure일 때만 돕니다. cancelled(연속 푸시로 취소)와 skipped(ci 실패로 밀림)는
  # 올라간 것이 없거나 뒤이은 run이 다시 알리므로 알리지 않습니다.
  notify-staging:
    name: Slack 테섭 배포 알림
    needs: [slack-thread, changes, cd-web]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.outputs.web == 'true' && (needs['cd-web'].result == 'success' || needs['cd-web'].result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Notify staging deploy
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_THREAD_TS: ${{ needs.slack-thread.outputs.thread_ts }}
          # 배포 스텝의 outcome만으로는 "배포하다 실패"와 "빌드에서 멈춰 배포까지 못 감"이
          # 둘 다 실패로 뭉개집니다. skipped는 앞 스텝에서 멈췄다는 뜻입니다.
          DEPLOY_OUTCOME: ${{ needs['cd-web'].outputs.staging_outcome }}
        run: node .github/scripts/notify-staging-deploy.mjs

  # master 머지 스레드에 타깃 하나의 빌드 결과를 댓글로 답니다(notify-web, notify-extension, notify-app).
  # 각 잡은 자기 cd-* 잡만 기다리므로 웹·확장 결과가 앱 빌드(약 30분)에 묶이지 않고 끝나는 대로 나갑니다.
  # slack-thread는 알림용 needs입니다. 실패·스킵돼도 always()라 이 잡들은 돌고,
  # 그때는 thread_ts가 비어 스크립트가 경고만 남기고 댓글을 건너뜁니다.
  # 댓글 여부(changed, result 조합)는 notify-thread-reply.mjs의 decideTargetReply가 판정합니다.
  notify-web:
    name: Slack 웹 빌드 알림
    needs: [slack-thread, changes, cd-web]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Notify web build
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_THREAD_TS: ${{ needs.slack-thread.outputs.thread_ts }}
          TARGET: web
          CHANGED: ${{ needs.changes.outputs.web }}
          RESULT: ${{ needs['cd-web'].result }}
        run: node .github/scripts/notify-thread-reply.mjs

  notify-extension:
    name: Slack 확장 빌드 알림
    needs: [slack-thread, changes, cd-extension]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.extension == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # 이 실행의 아티팩트 목록을 조회해 확장 다운로드 버튼을 달기 위해 actions: read가 필요합니다.
    # 잡에 permissions를 적으면 나머지가 none이 되므로 체크아웃용 contents: read도 함께 적습니다.
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Notify extension build
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_THREAD_TS: ${{ needs.slack-thread.outputs.thread_ts }}
          GH_TOKEN: ${{ github.token }}
          TARGET: extension
          CHANGED: ${{ needs.changes.outputs.extension }}
          RESULT: ${{ needs['cd-extension'].result }}
        run: node .github/scripts/notify-thread-reply.mjs

  notify-app:
    name: Slack 앱 빌드 알림
    needs: [slack-thread, changes, cd-app]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Notify app build
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_THREAD_TS: ${{ needs.slack-thread.outputs.thread_ts }}
          TARGET: app
          CHANGED: ${{ needs.changes.outputs.app }}
          RESULT: ${{ needs['cd-app'].result }}
        run: node .github/scripts/notify-thread-reply.mjs

  # 빌드 결과와 스토어 현황을 함께 Slack으로 알리고, 배포 버튼을 답니다.
  # 버튼을 누르면 apps/web의 /api/slack/interactivity가 release.yml을 실행합니다.
  # 모든 타깃이 끝난 뒤 머지 스레드의 마지막 댓글로 나갑니다. slack-thread는 알림용 needs이며,
  # 루트가 없어도(thread_ts 빈 값) 스크립트가 웹훅 최상위 메시지로 내려가 배포 버튼이 살아 있습니다.
  notify:
    name: Slack 알림
    needs: [ci, changes, slack-thread, cd-app, cd-extension, cd-web]
    # 앞 잡이 실패해도 알려야 하므로 always()입니다. 대신 master push에서만 돕니다.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # 알림 스크립트는 의존성이 없습니다(node:crypto + fetch). pnpm install을 건너뜁니다.
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_THREAD_TS: ${{ needs.slack-thread.outputs.thread_ts }}
          # skipped는 실패가 아니라 "변경이 없어 안 돎"입니다. 스크립트가 그렇게 해석합니다.
          BUILD_RESULTS: >-
            {"ci":"${{ needs.ci.result }}",
            "app":"${{ needs['cd-app'].result }}",
            "web":"${{ needs['cd-web'].result }}",
            "extension":"${{ needs['cd-extension'].result }}"}
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.EXPO_ANDROID_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: node .github/scripts/notify-build-ready.mjs
