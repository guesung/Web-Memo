name: CI

# required status check로 등록하려면 잡이 모든 PR에서 실행돼야 합니다.
# paths로 걸러 잡이 아예 뜨지 않으면 체크가 "대기중"에 머물러 머지가 영영 막힙니다.
# labeled/unlabeled는 PR을 연 뒤 build-app 라벨을 붙여도 앱 빌드가 돌게 하려고 받습니다.
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# master는 run에 배포가 걸려 있어 중간에 끊기면 안 되므로 취소하지 않고 줄을 세웁니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      # 이벤트에서 읽은 base 브랜치명은 로컬 ref가 없어 해석에 실패하고,
      # --affected가 조용히 "전부 변경됨"으로 폴백합니다. 그래서 기준을 명시합니다.
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Package boundaries
        run: pnpm exec turbo boundaries --filter="./packages/*"

      - name: Check (format + lint)
        run: pnpm check

      - name: Type check (affected only)
        run: pnpm exec turbo type-check --affected

      - name: Unit tests
        run: pnpm test:jest --run

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.detect.outputs.app }}
      extension: ${{ steps.detect.outputs.extension }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          # turbo가 base와 비교하려면 전체 히스토리가 필요합니다.
          fetch-depth: 0

      # 판정은 turbo 바이너리만 쓰므로 pnpm install이 필요 없습니다(러너 기본 node로 5초).
      - id: detect
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
        run: .github/scripts/detect-affected-apps.sh

  # 앱 빌드는 약 30분입니다. packages/shared를 웹·확장이 함께 써서
  # 앱과 무관한 PR까지 빌드를 끌고 오므로, PR에서는 build-app 라벨이 있을 때만 돌립니다.
  cd-app:
    needs: [ci, changes]
    # 재사용 워크플로의 잡은 호출자 권한을 넘어설 수 없습니다.
    # cd-app.yml은 체크아웃만 하므로 contents:read면 충분합니다.
    permissions:
      contents: read
    if: >-
      needs.changes.outputs.app == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-app'))
    uses: ./.github/workflows/cd-app.yml
    secrets: inherit
    with:
      # master에 머지돼도 자동으로 스토어에 올리지 않습니다. 여기서는 빌드가 되는지만 봅니다.
      # 실제 제출은 아래 notify가 보낸 Slack 메시지의 버튼 → release.yml 한 경로뿐입니다.
      # (docs/release-flow.md)
      deploy_target: "none"
      # master 머지분은 release.yml이 그대로 내려받아 제출하므로 스토어에 올릴 수 있는
      # 빌드여야 합니다(ci = autoIncrement on). PR 검증 빌드는 버려지므로 verify입니다.
      build_profile: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'ci' || 'verify' }}

  cd-extension:
    needs: [ci, changes]
    if: needs.changes.outputs.extension == 'true'
    uses: ./.github/workflows/cd-extension.yml
    secrets: inherit
    with:
      # develop 머지분은 staging으로 빌드합니다. 그래야 artifact zip을 받아 로드했을 때
      # 콘솔 로거와 debug_mode가 켜져 로깅이 실제로 나가는지 확인할 수 있습니다.
      # 스토어 업로드 잡은 production일 때만 도므로 게시에는 영향이 없습니다.
      deploy_target: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') && 'staging' || 'none' }}

  cd-web:
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/cd-web.yml
    secrets: inherit
    with:
      deploy_target: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') && 'staging' || 'none' }}

  # 빌드 결과와 스토어 현황을 함께 Slack으로 알리고, 배포 버튼을 답니다.
  # 버튼을 누르면 apps/web의 /api/slack/interactivity가 release.yml을 실행합니다.
  notify:
    name: Slack 알림
    needs: [ci, changes, cd-app, cd-extension, cd-web]
    # 앞 잡이 실패해도 알려야 하므로 always()입니다. 대신 master push에서만 돕니다.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      # 알림 스크립트는 의존성이 없습니다(node:crypto + fetch). pnpm install을 건너뜁니다.
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # skipped는 실패가 아니라 "변경이 없어 안 돎"입니다. 스크립트가 그렇게 해석합니다.
          BUILD_RESULTS: >-
            {"ci":"${{ needs.ci.result }}",
            "app":"${{ needs['cd-app'].result }}",
            "web":"${{ needs['cd-web'].result }}",
            "extension":"${{ needs['cd-extension'].result }}"}
          ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.EXPO_ANDROID_SERVICE_ACCOUNT_JSON }}
          CWS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: node .github/scripts/notify-build-ready.mjs
