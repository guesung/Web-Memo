name: CI

on:
  push:
    branches:
      - develop
      - master
    paths:
      - "apps/**"
      - "pages/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "apps/**"
      - "pages/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Package boundaries
        run: pnpm exec turbo boundaries --filter="./packages/*"

      - name: Check (format + lint)
        run: pnpm check

      - name: Type check (affected only)
        run: pnpm exec turbo type-check --affected

      - name: Unit tests
        run: pnpm test:jest --run

  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      extension: ${{ steps.filter.outputs.extension }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/app/**'
              - 'packages/shared/**'
              - 'packages/env/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            extension:
              - 'apps/chrome-extension/**'
              - 'pages/**'
              - 'packages/shared/**'
              - 'packages/ui/**'
              - 'packages/env/**'
              - 'packages/hmr/**'
              - 'packages/vite-config/**'
              - 'packages/tailwind-config/**'
              - 'packages/tsconfig/**'
              - 'packages/zipper/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/ui/**'
              - 'packages/env/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # 앱·확장은 CI에서 빌드 검증만 하고 배포하지 않습니다.
  # 실제 배포(TestFlight 제출 / 웹스토어 업로드 / 웹 프로덕션)는 release.yml에서 수동으로 실행합니다.
  cd-app:
    needs: [ci, changes]
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/cd-app.yml
    secrets: inherit
    with:
      deploy_target: "none"

  cd-extension:
    needs: [ci, changes]
    if: needs.changes.outputs.extension == 'true'
    uses: ./.github/workflows/cd-extension.yml
    secrets: inherit
    with:
      deploy_target: "none"

  # 웹은 develop push일 때만 스테이징(테스트 서버)에 자동 배포합니다.
  cd-web:
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/cd-web.yml
    secrets: inherit
    with:
      deploy_target: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') && 'staging' || 'none' }}
