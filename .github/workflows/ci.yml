name: CI

# required status check로 등록하려면 잡이 모든 PR에서 실행돼야 합니다.
# paths로 걸러 잡이 아예 뜨지 않으면 체크가 "대기중"에 머물러 머지가 영영 막힙니다.
# labeled/unlabeled는 PR을 연 뒤 build-app 라벨을 붙여도 앱 빌드가 돌게 하려고 받습니다.
on:
  push:
    branches:
      - develop
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# master는 run에 배포가 걸려 있어 중간에 끊기면 안 되므로 취소하지 않고 줄을 세웁니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      # 이벤트에서 읽은 base 브랜치명은 로컬 ref가 없어 해석에 실패하고,
      # --affected가 조용히 "전부 변경됨"으로 폴백합니다. 그래서 기준을 명시합니다.
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Package boundaries
        run: pnpm exec turbo boundaries --filter="./packages/*"

      - name: Check (format + lint)
        run: pnpm check

      - name: Type check (affected only)
        run: pnpm exec turbo type-check --affected

      - name: Unit tests
        run: pnpm test:jest --run

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      extension: ${{ steps.filter.outputs.extension }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/app/**'
              - 'packages/shared/**'
              - 'packages/env/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            extension:
              - 'apps/chrome-extension/**'
              - 'pages/**'
              - 'packages/shared/**'
              - 'packages/ui/**'
              - 'packages/env/**'
              - 'packages/hmr/**'
              - 'packages/vite-config/**'
              - 'packages/tailwind-config/**'
              - 'packages/tsconfig/**'
              - 'packages/zipper/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/ui/**'
              - 'packages/env/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # 앱 빌드는 iOS 22분 + Android 29분입니다. packages/shared를 웹·확장이 함께 써서
  # 앱과 무관한 PR까지 빌드를 끌고 오므로, PR에서는 build-app 라벨이 있을 때만 돌립니다.
  cd-app:
    needs: [ci, changes]
    # 재사용 워크플로의 잡은 호출자 권한을 넘어설 수 없습니다. cd-app의 notify가
    # actions:read를 써서, 여기서 넓히지 않으면 startup_failure로 파싱 단계에서 죽습니다.
    permissions:
      contents: read
      actions: read
    if: >-
      needs.changes.outputs.app == 'true' &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build-app'))
    uses: ./.github/workflows/cd-app.yml
    secrets: inherit
    with:
      deploy_target: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'production' || 'none' }}

  cd-extension:
    needs: [ci, changes]
    if: needs.changes.outputs.extension == 'true'
    uses: ./.github/workflows/cd-extension.yml
    secrets: inherit
    with:
      deploy_target: "none"

  cd-web:
    needs: [ci, changes]
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/cd-web.yml
    secrets: inherit
    with:
      deploy_target: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') && 'staging' || 'none' }}
