name: Cleanup unused files

# 월 1회 master에서 knip이 찾은 미사용 파일을 지우고 PR을 엽니다.
# 자동 머지는 하지 않습니다 — 머지는 사람의 승인을 항상 거칩니다.
#
# GITHUB_TOKEN 대신 GitHub App 토큰을 쓰는 이유: GITHUB_TOKEN으로 연 PR은
# 다른 워크플로를 트리거하지 않아 ci.yml·e2e.yml이 아예 돌지 않습니다.
# 그러면 이 워크플로 안의 검증이 PR 위에서 다시 확인되지 않습니다.
on:
  schedule:
    # 매월 1일 00:00 UTC (KST 09:00)
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "삭제·PR 없이 분류 결과만 확인합니다"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# 두 회차가 겹치면 같은 브랜치명으로 부딪힙니다. 앞선 회차를 끊지 않고 줄을 세웁니다.
concurrency:
  group: cleanup-unused
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # 전체 type-check + 단위 테스트를 삭제 항목 수만큼 되풀이할 수 있어 ci(15분)보다 깁니다.
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Cleanup unused files
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLEANUP_DRY_RUN: ${{ inputs.dry_run }}
          GIT_USER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_USER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: node .github/scripts/cleanup-unused-files.mjs
