name: E2E

# ci.yml과 같은 이유로 경로를 거르지 않습니다(required check는 잡이 안 뜨면 영영 대기중).
on:
  push:
    branches:
      - develop
      - master
  pull_request:

# master는 배포 판단의 근거가 되는 결과라 취소하지 않고 끝까지 돌립니다.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml', 'apps/web/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setting environment variables
        env:
          WEB_ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
        run: printf '%s\n' "$WEB_ENV_FILE" > apps/web/.env

      - name: Build The Extension
        run: pnpm run build:extension

      - name: Install playwright browsers
        run: pnpm exec playwright install chromium
        working-directory: e2e

      - name: Run tests
        run: pnpm run test:e2e

      # 리포트는 playwright.config가 있는 e2e/ 기준이라, 루트 경로로 올리면 조용히 빕니다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
