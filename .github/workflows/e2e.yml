name: E2E

# ci.yml과 같은 이유로 경로를 거르지 않습니다(required check는 잡이 안 뜨면 영영 대기중).
on:
  push:
    branches:
      - develop
      - master
  pull_request:

# 정기 E2E 보강 작업과 테스트 계정을 공유하므로 모든 실행을 같은 줄에 세웁니다.
concurrency:
  group: e2e-shared-test-account
  queue: max
  cancel-in-progress: false

jobs:
  tests_e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml', 'apps/web/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # 웹 서버 시크릿의 원천은 Vercel 프로젝트 환경변수입니다. development 환경 값을 받아 로컬 개발과
      # 같은 방식(apps/web/.env.local)으로 씁니다. production·preview 값은 sensitive라 받을 수 없습니다.
      # 토큰이 없는 실행(포크 PR 등)은 실패시키지 않고 넘어갑니다. 예전 방식도 빈 파일을 썼습니다.
      - name: Pull Vercel environment variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN 이 없어 환경 변수를 받지 않습니다"
            exit 0
          fi
          npm install --global vercel@latest
          vercel link --yes --project web-memo --scope gueit214s-projects --token "$VERCEL_TOKEN"
          vercel env pull apps/web/.env.local --environment=development --yes --token "$VERCEL_TOKEN"

      - name: Build The Extension
        run: pnpm run build:extension

      - name: Install playwright browsers
        run: pnpm exec playwright install chromium
        working-directory: e2e

      - name: Run tests
        run: pnpm run test:e2e

      # 재시도로 통과한 테스트(flaky)는 초록불에 가려지므로 건수를 요약에 남긴다.
      - name: Summarize flaky tests
        if: always()
        working-directory: e2e
        run: |
          if [ ! -f playwright-results.json ]; then
            echo "E2E 결과 파일이 없어 flaky 요약을 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const { stats, suites } = require("./playwright-results.json");
            const flakyTitles = [];
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests) {
                  if (test.status === "flaky") flakyTitles.push(`${spec.file} › ${spec.title}`);
                }
              }
              for (const child of suite.suites ?? []) walk(child);
            };
            for (const suite of suites) walk(suite);
            const lines = [
              "### E2E 결과",
              "",
              `| 통과 | 실패 | flaky | 건너뜀 |`,
              `| --- | --- | --- | --- |`,
              `| ${stats.expected} | ${stats.unexpected} | ${stats.flaky} | ${stats.skipped} |`,
              ...(flakyTitles.length ? ["", "flaky 테스트:", ...flakyTitles.map((title) => `- ${title}`)] : []),
            ];
            console.log(lines.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      # 리포트는 playwright.config가 있는 e2e/ 기준이라, 루트 경로로 올리면 조용히 빕니다.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
