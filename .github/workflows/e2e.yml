name: E2E

# ci.yml과 같은 이유로 경로를 거르지 않습니다.
# required status check는 잡이 실행되지 않으면 "대기중"으로 남아 머지를 막습니다.
on:
  push:
    branches:
      - develop
      - master
  pull_request:

# PR에 연속으로 푸시하면 이전 run을 취소합니다.
# master는 배포 판단의 근거가 되는 결과라 끝까지 돌립니다.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tests_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_URL: http://localhost:3000
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml', 'apps/web/next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setting environment variables
        env:
          SHARED_ENV_FILE: ${{ secrets.SHARED_ENV_FILE }}
          WEB_ENV_FILE: ${{ secrets.WEB_ENV_FILE }}
        run: |
          {
            printf '%s\n' "$SHARED_ENV_FILE"
            echo "WEB_URL=$WEB_URL"
            echo "NODE_ENV=development"
          } >> packages/env/.env

          {
            printf '%s\n' "$WEB_ENV_FILE"
            echo "NEXT_PUBLIC_WEB_URL=$WEB_URL"
          } > apps/web/.env

      - name: Build The Extension
        run: pnpm run build:extension

      - name: Install playwright browsers
        run: pnpm exec playwright install chromium
        working-directory: e2e

      - name: Run tests
        run: pnpm run test:e2e

      # 리포트는 playwright.config가 있는 e2e/ 기준으로 생성됩니다.
      # 루트 경로로 올리면 업로드할 파일이 없어 아티팩트가 조용히 비어버립니다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
