name: Env Manifest

# 코드·워크플로가 읽는 환경 변수 이름이 .github/env-manifest.yml 과 같은지, docs 표가 그 파일에서
# 생성한 것과 같은지 대조합니다. 어긋나면 PR이 실패합니다.
#
# 토큰이 필요 없는 검사만 합니다. GitHub·Vercel·Supabase에 실제 등록된 이름과의 대조는
# 콘솔에서 바뀌는 일이라 PR과 무관하므로 env-registry-audit.yml 이 스케줄로 맡습니다.
#
# required status check로 등록하려면 모든 PR에서 실행돼야 합니다. paths로 걸러 잡이 뜨지 않으면
# 체크가 "대기중"에 머물러 머지가 영영 막힙니다. 의존성 설치가 없어 몇 초면 끝나므로 걸러내지 않습니다.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: env-manifest-${{ github.ref }}
  cancel-in-progress: true

# 체크아웃 외에는 아무것도 건드리지 않습니다. 재사용 워크플로가 아니어도 권한이
# 호출자를 넘으면 로그도 annotation 도 없이 startup_failure 로 끝납니다.
permissions:
  contents: read

jobs:
  check:
    name: 환경 변수 매니페스트 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # 검사 스크립트는 의존성이 없습니다(node 내장 모듈만 씁니다). pnpm install을 건너뜁니다.
      - name: Check env manifest
        run: node .github/scripts/env/check-env-manifest.mjs
