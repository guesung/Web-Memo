name: Env Registry Audit

# GitHub Secrets·Vercel 프로젝트 환경변수·Supabase secrets에 실제로 등록된 이름을
# .github/env-manifest.yml 과 대조해, 다르면 Slack으로 알립니다.
#
# 콘솔에서 시크릿이 지워지거나 새로 생기는 일은 PR과 무관해서 PR CI(env-manifest.yml)가 못 잡습니다.
# 이름만 비교하므로 같은 이름이 두 저장소에 있을 때 값이 같은지는 확인하지 못합니다.
#
# 조회 토큰이 없거나 거절된 저장소는 실패가 아니라 "미조회"로 남깁니다.
#   GitHub   GitHub App(APP_ID, APP_PRIVATE_KEY)에 Secrets: read 권한이 있어야 합니다
#   Vercel   VERCEL_TOKEN
#   Supabase SUPABASE_ACCESS_TOKEN (GitHub Secrets에 등록)
on:
  schedule:
    # UTC 22:30 = Asia/Seoul 07:30. daily-ga-report(07:00)와 겹치지 않게 어긋나 있습니다.
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: env-registry-audit
  # 조회 결과가 곧 알림이라, 도는 중에 손으로 dispatch 해도 앞선 것이 취소되면 그날 알림이 사라집니다.
  cancel-in-progress: false

# 체크아웃 외에는 아무것도 건드리지 않습니다. 재사용 워크플로가 아니어도 권한이
# 호출자를 넘으면 로그도 annotation 도 없이 startup_failure 로 끝납니다.
permissions:
  contents: read

jobs:
  audit:
    name: 환경 변수 등록 현황 감사
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      # 저장소 Actions 시크릿 목록은 GITHUB_TOKEN으로 읽을 수 없어 GitHub App 토큰을 씁니다.
      # App에 Secrets: read 권한이 없으면 토큰 발급이 실패하는데, 그러면 GitHub만 "미조회"로 남기고
      # 나머지 저장소는 계속 대조해야 하므로 여기서 잡을 멈추지 않습니다.
      - uses: actions/create-github-app-token@v3
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-secrets: read

      # 스크립트는 의존성이 없습니다(node 내장 fetch만 씁니다). pnpm install을 건너뜁니다.
      - name: Audit env registry
        env:
          GH_AUDIT_TOKEN: ${{ steps.app-token.outputs.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node .github/scripts/audit-env-registry.mjs

      # 매일 도는 무인 잡이라 실패가 알림 부재와 구분되지 않습니다. 차이 알림이 안 온 날이
      # "일치한 날"인지 "감사가 깨진 날"인지 채널에서 바로 드러나야 합니다.
      # 실패 알림에 별도 스크립트를 두지 않습니다. 그 스크립트가 깨지면 같은 문제가 반복됩니다.
      - name: Notify failure
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL 이 없어 실패 알림을 건너뜁니다"
            exit 0
          fi
          curl --silent --show-error --fail-with-body \
            --header "content-type: application/json" \
            --data "{\"text\":\"❌ 환경 변수 등록 현황 감사 실패 — <$RUN_URL|실행 로그 보기>\"}" \
            "$SLACK_WEBHOOK_URL"
