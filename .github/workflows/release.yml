name: Release

# 버전업(package.json / Update.ts / translation.json)은 이 워크플로가 하지 않습니다.
# 로컬 `/version-update`로 처리해 master에 머지한 뒤 실행하세요.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "앱 배포 (iOS → TestFlight, Android → Play 내부 테스트)"
        type: boolean
        default: false
      extension:
        description: "확장 배포 (빌드 + 크롬 웹스토어 업로드, 게시는 수동)"
        type: boolean
        default: false
      web:
        description: "웹 배포 (Vercel 프로덕션)"
        type: boolean
        default: false
      ref:
        description: "배포할 커밋/태그 (비우면 워크플로를 실행한 브랜치의 최신 커밋)"
        type: string
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 타깃을 하나도 안 고르면 아무 잡도 안 돌아 실행이 조용히 끝납니다. 명시적 실패로 바꿉니다.
  preflight:
    name: 릴리스 대상 확인
    runs-on: ubuntu-latest
    steps:
      - name: Check at least one target
        env:
          APP: ${{ inputs.app }}
          EXTENSION: ${{ inputs.extension }}
          WEB: ${{ inputs.web }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          if [[ "$APP" != "true" && "$EXTENSION" != "true" && "$WEB" != "true" ]]; then
            echo "::error::배포할 타깃을 하나 이상 선택하세요 (app / extension / web)"
            exit 1
          fi
          echo "app=$APP extension=$EXTENSION web=$WEB"
          echo "ref=$REF"

  release-app:
    name: 앱 릴리스
    needs: preflight
    # 재사용 워크플로의 잡은 호출자 권한을 넘어설 수 없습니다. cd-app의 notify가
    # actions:read를 써서, 여기서 넓히지 않으면 startup_failure로 파싱 단계에서 죽습니다.
    permissions:
      contents: read
      actions: read
    if: ${{ inputs.app }}
    uses: ./.github/workflows/cd-app.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}

  release-extension:
    name: 확장 릴리스
    needs: preflight
    if: ${{ inputs.extension }}
    uses: ./.github/workflows/cd-extension.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}

  release-web:
    name: 웹 릴리스
    needs: preflight
    if: ${{ inputs.web }}
    uses: ./.github/workflows/cd-web.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}
