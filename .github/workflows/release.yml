name: Release

# 버전업(package.json / Update.ts / translation.json)은 이 워크플로가 하지 않습니다.
# 로컬 `/version-update`로 처리해 master에 머지한 뒤 실행하세요.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "앱 배포 (iOS → TestFlight, Android → Play 내부 테스트)"
        type: boolean
        default: false
      extension:
        description: "확장 배포 (빌드 + 크롬 웹스토어 업로드, 게시는 수동)"
        type: boolean
        default: false
      web:
        description: "웹 배포 (Vercel 프로덕션)"
        type: boolean
        default: false
      ref:
        description: "배포할 커밋/태그 (비우면 워크플로를 실행한 브랜치의 최신 커밋)"
        type: string
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 타깃을 하나도 안 고르면 아무 잡도 안 돌아 실행이 조용히 끝납니다. 명시적 실패로 바꿉니다.
  preflight:
    name: 릴리스 대상 확인
    runs-on: ubuntu-latest
    steps:
      - name: Check at least one target
        env:
          APP: ${{ inputs.app }}
          EXTENSION: ${{ inputs.extension }}
          WEB: ${{ inputs.web }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          if [[ "$APP" != "true" && "$EXTENSION" != "true" && "$WEB" != "true" ]]; then
            echo "::error::배포할 타깃을 하나 이상 선택하세요 (app / extension / web)"
            exit 1
          fi
          echo "app=$APP extension=$EXTENSION web=$WEB"
          echo "ref=$REF"

  release-app:
    name: 앱 릴리스
    needs: preflight
    # 재사용 워크플로의 잡은 호출자 권한을 넘어설 수 없습니다.
    # actions:read는 master CI가 올려둔 빌드 아티팩트를 찾아 내려받는 데 필요합니다.
    permissions:
      contents: read
      actions: read
    if: ${{ inputs.app }}
    uses: ./.github/workflows/cd-app.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}

  release-extension:
    name: 확장 릴리스
    needs: preflight
    # actions:read는 master CI가 올려둔 빌드 아티팩트를 찾아 내려받는 데 필요합니다.
    permissions:
      contents: read
      actions: read
    if: ${{ inputs.extension }}
    uses: ./.github/workflows/cd-extension.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}

  release-web:
    name: 웹 릴리스
    needs: preflight
    if: ${{ inputs.web }}
    uses: ./.github/workflows/cd-web.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}

  # Slack 버튼을 누른 사람에게 "정말 올라갔는지"를 알리는 유일한 신호입니다.
  # 타깃마다 따로 알립니다. 하나로 묶으면 needs가 정적이라 알림이 가장 느린 타깃
  # (앱 빌드 약 30분)을 기다려, 1분이면 끝나는 웹 배포 결과까지 그만큼 늦게 나갑니다.
  #
  # 셋 다 실패해도 알려야 하므로 always()입니다.
  # 타깃을 하나도 안 골라 preflight가 막은 경우에는 알릴 내용이 없습니다.
  notify-app:
    name: 앱 릴리스 알림
    needs: [preflight, release-app]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.app }}
    permissions:
      contents: read
      # matrix 잡의 플랫폼별 결과를 조회하는 데 필요합니다.
      actions: read
    uses: ./.github/workflows/notify-release.yml
    secrets: inherit
    with:
      target: app
      result: ${{ needs['release-app'].result }}
      ref: ${{ inputs.ref }}

  notify-extension:
    name: 확장 릴리스 알림
    needs: [preflight, release-extension]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.extension }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-release.yml
    secrets: inherit
    with:
      target: extension
      result: ${{ needs['release-extension'].result }}
      ref: ${{ inputs.ref }}

  notify-web:
    name: 웹 릴리스 알림
    needs: [preflight, release-web]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.web }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/notify-release.yml
    secrets: inherit
    with:
      target: web
      result: ${{ needs['release-web'].result }}
      ref: ${{ inputs.ref }}
