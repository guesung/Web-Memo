name: Release

# 배포 전 버전업(package.json / Update.ts / translation.json)은 이 워크플로가 하지 않습니다.
# 로컬 `/version-update`로 처리해 master에 머지한 뒤 실행하세요.
# 확장·앱 배포가 성공하면 next-version-* 잡이 "다음 버전" PR을 열어 둡니다(자동 머지 없음).
on:
  workflow_dispatch:
    inputs:
      app:
        description: "앱 배포 (iOS → TestFlight, Android → Play 내부 테스트)"
        type: boolean
        default: false
      extension:
        description: "확장 배포 (빌드 + 크롬 웹스토어 업로드, 심사를 통과하면 바로 게시)"
        type: boolean
        default: false
      web:
        description: "웹 배포 (Vercel 프로덕션)"
        type: boolean
        default: false
      ref:
        description: "배포할 커밋/태그 (비우면 워크플로를 실행한 브랜치의 최신 커밋)"
        type: string
        required: false
        default: ""

jobs:
  # 타깃을 하나도 안 고르면 아무 잡도 안 돌아 실행이 조용히 끝납니다. 명시적 실패로 바꿉니다.
  preflight:
    name: 릴리스 대상 확인
    runs-on: ubuntu-26.04
    steps:
      - name: Check at least one target
        env:
          APP: ${{ inputs.app }}
          EXTENSION: ${{ inputs.extension }}
          WEB: ${{ inputs.web }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          if [[ "$APP" != "true" && "$EXTENSION" != "true" && "$WEB" != "true" ]]; then
            echo "::error::배포할 타깃을 하나 이상 선택하세요 (app / extension / web)"
            exit 1
          fi
          echo "app=$APP extension=$EXTENSION web=$WEB"
          echo "ref=$REF"

  release-app:
    name: 앱 릴리스
    needs: preflight
    # 재사용 워크플로의 잡은 호출자 권한을 넘어설 수 없습니다.
    # actions:read는 master CI가 올려둔 Android 빌드 아티팩트를 찾아 내려받는 데 필요합니다.
    permissions:
      contents: read
      actions: read
    if: ${{ inputs.app }}
    # 공통 앱 큐는 cd-app의 실제 빌드 잡에 있습니다. 호출자가 같은 잠금을 잡지 않습니다.
    uses: ./.github/workflows/cd-app.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}

  release-extension:
    name: 확장 릴리스
    needs: preflight
    # actions:read는 master CI가 올려둔 빌드 아티팩트를 찾아 내려받는 데 필요합니다.
    permissions:
      contents: read
      actions: read
    if: ${{ inputs.extension }}
    # 타깃별로 줄을 세웁니다. 워크플로 전체를 한 그룹으로 묶으면 앱 빌드(약 30분)가
    # 도는 동안 1분이면 끝나는 웹 배포까지 통째로 대기합니다.
    # 같은 타깃의 중복 배포(스토어 이중 제출)는 그대로 막습니다.
    concurrency:
      group: release-extension
      cancel-in-progress: false
    uses: ./.github/workflows/cd-extension.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}

  release-web:
    name: 웹 릴리스
    needs: preflight
    if: ${{ inputs.web }}
    # 타깃별로 줄을 세웁니다. 워크플로 전체를 한 그룹으로 묶으면 앱 빌드(약 30분)가
    # 도는 동안 1분이면 끝나는 웹 배포까지 통째로 대기합니다.
    # 같은 타깃의 중복 배포(스토어 이중 제출)는 그대로 막습니다.
    concurrency:
      group: release-web
      cancel-in-progress: false
    uses: ./.github/workflows/cd-web.yml
    secrets: inherit
    with:
      deploy_target: "production"
      ref: ${{ inputs.ref }}

  # Slack 버튼을 누른 사람에게 "정말 올라갔는지"를 알리는 유일한 신호입니다.
  # 타깃마다 따로 알립니다. 하나로 묶으면 needs가 정적이라 알림이 가장 느린 타깃
  # (앱 빌드 약 30분)을 기다려, 1분이면 끝나는 웹 배포 결과까지 그만큼 늦게 나갑니다.
  #
  # 셋 다 실패해도 알려야 하므로 always()입니다.
  # 타깃을 하나도 안 골라 preflight가 막은 경우에는 알릴 내용이 없습니다.
  notify-app:
    name: 앱 릴리스 알림
    needs: [preflight, release-app]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.app }}
    permissions:
      contents: read
      # matrix 잡의 플랫폼별 결과를 조회하는 데 필요합니다.
      actions: read
    uses: ./.github/workflows/release-notify.yml
    secrets: inherit
    with:
      target: app
      result: ${{ needs['release-app'].result }}
      ref: ${{ inputs.ref }}

  notify-extension:
    name: 확장 릴리스 알림
    needs: [preflight, release-extension]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.extension }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-notify.yml
    secrets: inherit
    with:
      target: extension
      result: ${{ needs['release-extension'].result }}
      ref: ${{ inputs.ref }}

  notify-web:
    name: 웹 릴리스 알림
    needs: [preflight, release-web]
    if: ${{ always() && needs.preflight.result == 'success' && inputs.web }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-notify.yml
    secrets: inherit
    with:
      target: web
      result: ${{ needs['release-web'].result }}
      ref: ${{ inputs.ref }}

  # 배포가 성공한 트랙의 "다음 버전" PR을 열어 둡니다(트랙당 PR 하나, 자동 머지 없음).
  # 버전은 실제 배포 때만 움직입니다(노션 「버전 관리」(https://app.notion.com/p/40f89de02fde8100a8bcc728cedf2ef5)). 이 PR은 Slack에서 버전 올려 배포를 고를 때 머지됩니다.
  # 알림 잡과 별개라 이 잡이 실패해도 릴리스 결과 알림은 영향이 없고, 이 잡만 빨갛게 드러납니다.
  # GITHUB_TOKEN으로 연 PR은 다른 워크플로를 트리거하지 않아 CI가 안 도므로 GitHub App 토큰을 씁니다.
  next-version-extension:
    name: 확장 다음 버전 PR
    needs: release-extension
    if: ${{ needs.release-extension.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    # 두 회차가 겹치면 같은 브랜치에 push가 부딪힙니다. 앞선 회차를 끊지 않고 줄을 세웁니다.
    concurrency:
      group: next-version-extension
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # 배포한 ref를 체크아웃합니다(비우면 워크플로를 실행한 브랜치). 스크립트는 이 HEAD의 버전에서 patch를 올립니다.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Sync next version PR
        env:
          TRACK: extension
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_USER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_USER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/deploy/sync-next-version-pr.mjs

  # 배포가 성공한 트랙의 "다음 버전" PR을 열어 둡니다(트랙당 PR 하나, 자동 머지 없음).
  # 버전은 실제 배포 때만 움직입니다(노션 「버전 관리」(https://app.notion.com/p/40f89de02fde8100a8bcc728cedf2ef5)). 이 PR은 Slack에서 버전 올려 배포를 고를 때 머지됩니다.
  # 알림 잡과 별개라 이 잡이 실패해도 릴리스 결과 알림은 영향이 없고, 이 잡만 빨갛게 드러납니다.
  # GITHUB_TOKEN으로 연 PR은 다른 워크플로를 트리거하지 않아 CI가 안 도므로 GitHub App 토큰을 씁니다.
  next-version-app:
    name: 앱 다음 버전 PR
    needs: release-app
    if: ${{ needs.release-app.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    # 두 회차가 겹치면 같은 브랜치에 push가 부딪힙니다. 앞선 회차를 끊지 않고 줄을 세웁니다.
    concurrency:
      group: next-version-app
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # 배포한 ref를 체크아웃합니다(비우면 워크플로를 실행한 브랜치). 스크립트는 이 HEAD의 버전에서 patch를 올립니다.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Sync next version PR
        env:
          TRACK: app
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_USER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_USER_EMAIL: ${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/deploy/sync-next-version-pr.mjs
