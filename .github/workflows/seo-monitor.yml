name: SEO Monitor

# 운영 사이트의 공개 SEO 응답과 선택적 Search Console 지표를 매일 검사합니다.
# 상세 결과는 이전 master 실행과 비교하고 Actions 아티팩트로 보관합니다.
on:
  schedule:
    # UTC 00:17 = Asia/Seoul 09:17. 정각의 Actions 실행 혼잡을 피하려고 17분에 실행합니다.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Search Console 주간 검색 성과도 함께 조회합니다."
        type: boolean
        default: false

concurrency:
  group: seo-monitor
  # 예약 실행 중 수동 실행이 들어와도 앞선 검사를 없애지 않고 순서대로 처리합니다.
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: 운영 사이트 SEO 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      # SSR HTML을 브라우저와 같은 방식으로 파싱하기 위해 저장소의 jsdom을 사용합니다.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Find previous SEO report
        id: previous-seo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/find-previous-seo-report.mjs

      - name: Inspect production SEO
        id: seo-check
        env:
          SEO_BASELINE_STATUS: ${{ steps.previous-seo.outputs.baseline_status }}
          SEO_PREVIOUS_REPORT: ${{ steps.previous-seo.outputs.SEO_PREVIOUS_REPORT }}
        run: pnpm seo:check

      - name: Inspect Search Console
        if: ${{ always() }}
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SEO_GSC_WEEKLY: ${{ inputs.weekly && 'true' || 'false' }}
        run: pnpm seo:gsc

      - name: Notify actionable SEO issues
        if: ${{ always() }}
        env:
          SEO_CHECK_OUTCOME: ${{ steps.seo-check.outcome }}
          SLACK_REPORT_WEBHOOK_URL: ${{ secrets.SLACK_REPORT_WEBHOOK_URL }}
        run: node .github/scripts/notify-seo-slack.mjs

      - name: Upload SEO report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: seo-report-${{ github.run_id }}
          path: artifacts/seo/
          if-no-files-found: warn
          retention-days: 30
