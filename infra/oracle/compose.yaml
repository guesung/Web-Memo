# VM의 /opt/webmemo 에서 실행합니다(scripts/sync.sh와 배포 워크플로가 이 파일을 보냅니다).
# 같은 디렉터리의 .env(VM에만 있음)로 사이트 주소와 색별 이미지를 정합니다.
#   SITE_ADDRESS     Caddy 사이트 주소. 비우면 ":80"(IP로 HTTP 확인용)
#   WEB_IMAGE_BLUE   blue 색 이미지. 비우면 확인용 whoami
#   WEB_IMAGE_GREEN  green 색 이미지. 비우면 확인용 whoami
#   API_IMAGE        API 서버(apps/api) 이미지. 비우면 확인용 whoami
#   API_SITE_ADDRESS API의 Caddy 사이트 주소(api.webmemo.xyz). 비우면 api.localhost(외부에서 안 보임)
#
# alloy(관측 수집기)는 observability 프로필이라 `docker compose up -d`로는 뜨지 않습니다.
# env/alloy.env(Grafana Cloud 자격 증명)가 있을 때 deploy.sh가 `docker compose up -d alloy`로 띄웁니다.
#
# 트래픽을 받는 색은 state/color/active 파일 한 줄(blue·green)이 정합니다. 앱의 /api/health가
# 이 파일과 자기 DEPLOY_COLOR를 비교해 200·503을 돌려주고, Caddy는 200인 쪽으로만 보냅니다.
name: webmemo

x-web-env: &web-env
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  # 확인용 whoami 이미지가 읽는 포트 변수. 앱 이미지는 무시합니다.
  WHOAMI_PORT_NUMBER: "3000"

x-web: &web
  restart: unless-stopped
  env_file:
    - path: ./env/web.env
      required: false
  expose:
    - "3000"
  volumes:
    # 활성 색 파일. 파일이 아니라 디렉터리를 마운트해야 mv로 바꾼 새 파일이 컨테이너에 보입니다.
    - ./state/color:/run/webmemo:ro
  # SIGTERM 뒤 진행 중인 요청과 Next after() 작업을 끝낼 시간을 줍니다.
  stop_grace_period: 30s

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_SITE_ADDRESS: ${API_SITE_ADDRESS:-api.localhost}
      # Cloudflare 대역. Caddy가 trusted_proxies(실제 사용자 IP 꺼내기)와 직접 접속 차단에 함께 씁니다.
      # 출처: https://www.cloudflare.com/ips-v4/ , https://www.cloudflare.com/ips-v6/ (2026-11-18)
      CLOUDFLARE_IPS: >-
        173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # 컨테이너 로그 → Loki, 호스트·컨테이너 지표 → Prometheus (Grafana Cloud). 설정: alloy/config.alloy
  # cadvisor가 cgroup·docker 상태를 읽으려면 privileged와 호스트 경로 마운트가 필요합니다(Alloy 공식 문서의 Docker 예시).
  alloy:
    image: grafana/alloy:v1.22.0
    profiles: [observability]
    restart: unless-stopped
    privileged: true
    env_file:
      - path: ./env/alloy.env
        required: false
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # 회수 방지 기준(메모리 20%)과 별개로, 수집기가 앱 메모리를 잡아먹지 않게 상한을 둡니다
    mem_limit: 256m

  web-blue:
    <<: *web
    image: ${WEB_IMAGE_BLUE:-traefik/whoami:v1.10}
    environment:
      <<: *web-env
      DEPLOY_COLOR: blue

  web-green:
    <<: *web
    image: ${WEB_IMAGE_GREEN:-traefik/whoami:v1.10}
    environment:
      <<: *web-env
      DEPLOY_COLOR: green

  # API 서버(apps/api). 웹과 달리 한 대만 둡니다(blue-green 없음) — 교체하는 몇 초 동안은 요청이 실패합니다.
  # 배포는 scripts/deploy-api.sh가 맡고, 런타임 환경 변수는 CI가 GitHub Secrets로 만든 env/api.env입니다.
  api:
    image: ${API_IMAGE:-traefik/whoami:v1.10}
    restart: unless-stopped
    env_file:
      - path: ./env/api.env
        required: false
    environment:
      PORT: "4000"
      WHOAMI_PORT_NUMBER: "4000"
    expose:
      - "4000"
    stop_grace_period: 15s
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
  alloy_data:
